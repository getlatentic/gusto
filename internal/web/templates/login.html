<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latentic Agent Cloud</title>
<link rel="icon" href="/static/mark.png">
<link rel="stylesheet" href="/static/tokens.css">
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; display: grid; place-items: center;
  background: var(--yg-bg); color: var(--yg-text); font: 15px/1.55 var(--yg-font-text); }
main { width: min(22rem, 92vw); display: grid; gap: var(--yg-space-6);
  padding: var(--yg-space-8); background: var(--yg-surface);
  border-radius: var(--yg-radius-lg); box-shadow: var(--yg-shadow-2); }
.brand { display: flex; align-items: center; gap: var(--yg-space-3);
  font: 600 1.125rem/1 var(--yg-font-display); letter-spacing: -.01em; }
.brand img { width: 28px; height: auto; }
form { display: grid; gap: var(--yg-space-3); }
input { font: inherit; padding: var(--yg-space-3); width: 100%;
  border: 1px solid var(--yg-border-strong); border-radius: var(--yg-radius-sm);
  background: var(--yg-surface); color: var(--yg-text); }
input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--yg-focus); outline-offset: 2px; }
button, a.button { font: 600 inherit; cursor: pointer; text-align: center; text-decoration: none;
  padding: var(--yg-space-3); border: 0; border-radius: var(--yg-radius-sm);
  background: var(--yg-accent); color: var(--yg-on-accent); }
button:hover, a.button:hover { background: var(--yg-accent-hover); }
/* Secondary only when something else on the page is primary. A page with one
   action does not have a quiet one. */
form.password button { background: none; color: var(--yg-text-muted); font-weight: 400;
  border: 1px solid var(--yg-border-strong); }
form.password button:hover { background: var(--yg-bg-subtle); color: var(--yg-text); }
p { margin: 0; font-size: .8125rem; color: var(--yg-danger); }
/* The way in when the provider is not. It is not the offer on this page, so it
   is a line of text under one. */
.other { text-align: center; color: var(--yg-text-muted); }
.other a { color: inherit; text-decoration: none; }
.other a:hover { color: var(--yg-text); }
hr { border: 0; border-top: 1px solid var(--yg-border); margin: 0; }
svg { width: 18px; height: 18px; vertical-align: -4px; margin-right: var(--yg-space-2); }
</style>
</head>
<body>
<main>
  <div class="brand"><img src="/static/mark.png" alt=""> Latentic Agent Cloud</div>
  {{if .Refused}}<p>{{.Refused}}</p>{{end}}
  {{if .Wrong}}<p>That is not the password.</p>{{end}}

  {{if .Identity}}
  <a class="button" href="/auth/start"><svg viewBox="0 0 18 18" aria-hidden="true"><path fill="currentColor" d="M17.6 9.2c0-.6-.1-1.2-.2-1.7H9v3.3h4.8a4.1 4.1 0 0 1-1.8 2.7v2.2h2.9c1.7-1.6 2.7-3.9 2.7-6.5z"/><path fill="currentColor" d="M9 18c2.4 0 4.5-.8 6-2.2l-2.9-2.2c-.8.5-1.8.9-3.1.9-2.4 0-4.4-1.6-5.1-3.8H.9v2.3A9 9 0 0 0 9 18z"/><path fill="currentColor" d="M3.9 10.7a5.4 5.4 0 0 1 0-3.4V5H.9a9 9 0 0 0 0 8z"/><path fill="currentColor" d="M9 3.6c1.3 0 2.5.5 3.4 1.3l2.6-2.6A9 9 0 0 0 .9 5l3 2.3C4.6 5.2 6.6 3.6 9 3.6z"/></svg>Continue with Google</a>
  {{end}}

  {{if .Shared}}
  {{if .Identity}}<hr>{{end}}
  <form{{if .Identity}} class="password"{{end}} method="post" action="/login">
    <input type="password" name="password" placeholder="Shared password" {{if not .Identity}}autofocus{{end}} required>
    <button type="submit">Sign in</button>
  </form>
  {{else}}
  <p class="other"><a href="/login?shared">Use the shared password</a></p>
  {{end}}
</main>
</body></html>
