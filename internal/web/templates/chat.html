{{template "head" .}}

<section class="talk fresh">
  <div class="hero">
    <h2>What are we working on?</h2>
    {{if .Refused}}<p class="refused">{{.Refused}}</p>{{end}}
    {{if not .Picks}}<p class="muted">This deployment cannot start an agent yet.</p>{{end}}
    {{if .Picks}}
    <div class="composer">
    <form class="column" method="post" action="/chat">
      <div class="box">
        <textarea name="said" rows="1" placeholder="Message" autofocus required></textarea>
        <div class="tools">
          <div class="folder" id="folder-pick" hidden>
            <input type="hidden" name="folder">
            <input type="hidden" name="folder_name">
            <a class="chip" href="/app/folder" title="Work in a folder on this computer">{{template "icon-folder"}}<span class="label">Work in a folder</span></a>
            <button type="button" class="clear" hidden aria-label="Do not use a folder">{{template "icon-x"}}</button>
          </div>
          <span class="grow"></span>
          <div class="picker" id="harness-pick" data-picker data-options="{{.Agents}}" data-label="Agent">
            <input type="hidden" name="harness" value="{{.Harness}}">
            <button type="button" aria-haspopup="listbox"><span class="label"></span>{{template "icon-chevron"}}</button>
            <div class="menu" role="listbox"></div>
          </div>
          <div class="picker" id="model-pick" data-picker data-label="Model">
            <input type="hidden" name="model" value="{{.Model}}">
            <button type="button" aria-haspopup="listbox"><span class="label"></span>{{template "icon-chevron"}}</button>
            <div class="menu" role="listbox"></div>
          </div>
          <button type="submit" class="send" title="Send">{{template "icon-send"}}<span class="sr">Send</span></button>
        </div>
      </div>
    </form>
    </div>
    {{end}}
  </div>
</section>

{{if .Picks}}
<script src="{{asset "/static/picker.js"}}"></script>
<script nonce="{{.Nonce}}" data-models="{{.Models}}">
(function () {
  var byHarness = JSON.parse(document.currentScript.dataset.models);
  var harness = document.getElementById("harness-pick");
  var model = document.getElementById("model-pick");
  // A harness is offered the models it can use, so choosing one changes what the other lists, and keeps the model when it has it too.
  var narrow = function () {
    var offered = byHarness[harness.picker.value] || [];
    var kept = offered.some(function (each) { return each.value === model.picker.value; });
    model.picker.setOptions(offered, kept ? model.picker.value : (offered[0] || {}).value);
  };
  harness.addEventListener("pick", narrow);
  narrow();

  // Choosing a folder on this computer is done by the desktop app, which asks the system for it and tells the page what it chose.
  var folder = document.getElementById("folder-pick");
  if (window.latenticDesktop) {
    folder.hidden = false;
    var keep = folder.querySelectorAll("input");
    var label = folder.querySelector(".label");
    var clear = folder.querySelector(".clear");
    var none = label.textContent;
    window.latenticFolder = function (chosen) {
      keep[0].value = chosen.key;
      keep[1].value = chosen.name;
      label.textContent = chosen.name;
      clear.hidden = false;
    };
    clear.addEventListener("click", function () {
      keep[0].value = keep[1].value = "";
      label.textContent = none;
      clear.hidden = true;
    });
  }

  var box = document.querySelector(".composer textarea");
  var grow = function () { box.style.height = "auto"; box.style.height = box.scrollHeight + "px"; };
  box.addEventListener("input", grow);
  box.addEventListener("keydown", function (event) {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      if (box.value.trim()) { box.form.requestSubmit(); }
    }
  });
})();
</script>
{{end}}

{{template "foot" .}}
