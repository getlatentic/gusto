{{template "head" .}}

<section class="talk fresh">
  <div class="hero">
    <h2>What are we working on?</h2>
    {{if .Refused}}<p class="refused">{{.Refused}}</p>{{end}}
    {{if not .Picks}}<p class="muted">This deployment cannot start an agent yet.</p>{{end}}
    {{if .Picks}}
    <div class="composer">
    <form class="column" method="post" action="/chat">
      <div class="box">
        <textarea name="said" rows="1" placeholder="Message" autofocus required></textarea>
        <div class="tools">
          <div class="folderpick" id="folder-pick"{{with .Start.At}} data-at="{{.}}" data-label="{{$.Start.Name}}" data-harness="{{$.Start.Harness}}"{{end}}>
            <input type="hidden" name="at">
            <input type="hidden" name="folder">
            <input type="hidden" name="folder_name">
            <button type="button" class="chip" aria-haspopup="dialog" aria-expanded="false">{{template "icon-folder"}}<span class="label">Choose a folder</span></button>
            <button type="button" class="clear" hidden aria-label="Do not use a folder">{{template "icon-x"}}</button>
          </div>
          <span class="grow"></span>
          <div class="picker" id="role-pick" data-picker data-options="{{.Roles}}" data-label="Preset">
            <input type="hidden" name="choice" value="{{.Role}}">
            <button type="button" aria-haspopup="listbox"><span class="label"></span>{{template "icon-chevron"}}</button>
            <div class="menu" role="listbox"></div>
          </div>
          <input type="hidden" name="role" id="role-value">
          <div class="picker" id="harness-pick" data-picker data-options="{{.Agents}}" data-label="Engine">
            <input type="hidden" name="harness" value="{{.Harness}}">
            <button type="button" aria-haspopup="listbox"><span class="label"></span>{{template "icon-chevron"}}</button>
            <div class="menu" role="listbox"></div>
          </div>
          <div class="picker" id="model-pick" data-picker data-label="Model">
            <input type="hidden" name="model" value="{{.Model}}">
            <button type="button" aria-haspopup="listbox"><span class="label"></span>{{template "icon-chevron"}}</button>
            <div class="menu" role="listbox"></div>
          </div>
          <button type="submit" class="send" title="Send">{{template "icon-send"}}<span class="sr">Send</span></button>
        </div>
      </div>
    </form>
    <div class="starters" id="chat-starters">
      <button type="button" class="starter" data-said="Fix the failing tests">Fix the failing tests</button>
      <button type="button" class="starter" data-said="Summarise this folder">Summarise this folder</button>
      <button type="button" class="starter" data-said="Add tests for what changed">Add tests for what changed</button>
    </div>
    <form class="save-preset" id="save-preset" method="post" action="/presets" hidden>
      <input name="name" placeholder="Name this preset" maxlength="60" aria-label="Name of the preset" required>
      <input type="hidden" name="harness"><input type="hidden" name="model"><input type="hidden" name="role">
      <button type="submit" class="cta">Save preset</button>
      <button type="button" class="quiet-button" data-cancel>Cancel</button>
    </form>
    </div>
    {{end}}
  </div>
</section>

{{if .Picks}}
<script src="{{asset "/static/picker.js"}}"></script>
<script src="{{asset "/static/explorer.js"}}"></script>
<script src="{{asset "/static/folderpick.js"}}"></script>
<script nonce="{{.Nonce}}" data-models="{{.Models}}">
(function () {
  var byHarness = JSON.parse(document.currentScript.dataset.models);
  var harness = document.getElementById("harness-pick");
  var model = document.getElementById("model-pick");
  // A harness is offered the models it can use, so choosing one changes what the other lists, and keeps the model when it has it too.
  var narrow = function () {
    var offered = byHarness[harness.picker.value] || [];
    var kept = offered.some(function (each) { return each.value === model.picker.value; });
    model.picker.setOptions(offered, kept ? model.picker.value : (offered[0] || {}).value);
  };
  harness.addEventListener("pick", narrow);
  narrow();

  // A role, or a preset, sets what the chat starts with: a preset also sets the engine and the model, and "save" keeps the current ones.
  var role = document.getElementById("role-pick");
  var roleValue = document.getElementById("role-value");
  var saving = document.getElementById("save-preset");
  var choices = {};
  JSON.parse(role.dataset.options).forEach(function (each) { if (each.kind !== "heading" && each.kind !== "separator") { choices[each.value] = each; } });
  var settled = role.picker.value;
  var apply = function (value) {
    var choice = choices[value] || {};
    roleValue.value = choice.role || "";
    if (choice.harness) {
      harness.picker.select(choice.harness);
      if (choice.model) { model.picker.select(choice.model); }
    }
  };
  role.addEventListener("pick", function () {
    var value = role.picker.value;
    if (value !== "save") { settled = value; saving.hidden = true; apply(value); return; }
    role.picker.select(settled);
    saving.elements.harness.value = harness.picker.value;
    saving.elements.model.value = model.picker.value;
    saving.elements.role.value = roleValue.value;
    saving.hidden = false;
    saving.elements.name.focus();
  });
  saving.querySelector("[data-cancel]").addEventListener("click", function () { saving.hidden = true; });
  apply(settled);

  // The folder a chat works in is chosen in the explorer, which follows the agent it belongs to.
  var chosen = document.getElementById("folder-pick");
  chosen.addEventListener("chosen", function (event) {
    if (event.detail.harness) { harness.picker.select(event.detail.harness); }
    harness.picker.lock(Boolean(event.detail.harness));
    role.picker.lock(Boolean(event.detail.harness));
  });

  var box = document.querySelector(".composer textarea");
  document.getElementById("chat-starters").addEventListener("click", function (event) {
    var starter = event.target.closest(".starter");
    if (!starter) { return; }
    box.value = starter.dataset.said;
    box.dispatchEvent(new Event("input"));
    box.focus();
  });
  var grow = function () { box.style.height = "auto"; box.style.height = box.scrollHeight + "px"; };
  box.addEventListener("input", grow);
  box.addEventListener("keydown", function (event) {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      if (box.value.trim()) { box.form.requestSubmit(); }
    }
  });
})();
</script>
{{end}}

{{template "foot" .}}
