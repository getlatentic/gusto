{{template "head" .}}

{{template "ui-bar-open"}}
  <div class="bar-where"><h1 class="bar-title">New room</h1></div>
{{template "ui-bar-close"}}
{{template "body" .}}

{{template "ui-flash" .}}

<p class="page-sub">A room is a chat that people and agents share, with one folder they all work in.</p>

<form class="grid max-w-xl gap-4 card" method="post" action="/rooms">
  <label class="field">Name it <input class="input" name="name" placeholder="Launch plan" maxlength="60" required autofocus></label>
  <div><button type="submit" class="btn">Make the room</button></div>
</form>

{{template "foot" .}}
