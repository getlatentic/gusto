{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<link rel="icon" href="/static/mark.png">
<link rel="stylesheet" href="/static/tokens.css">
<script src="/static/htmx.min.js" defer></script>
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0 auto; padding: var(--yg-space-6) var(--yg-space-4) var(--yg-space-20);
  max-width: 64rem; background: var(--yg-bg); color: var(--yg-text);
  font: 15px/1.55 var(--yg-font-text); }

/* Header: a mark, a name, where to go, and a way out. Nothing else. */
header { display: flex; align-items: center; gap: var(--yg-space-5);
  padding-bottom: var(--yg-space-4); margin-bottom: var(--yg-space-8);
  border-bottom: 1px solid var(--yg-border); }
header .mark { display: flex; align-items: center; gap: var(--yg-space-2);
  font: 600 1rem/1 var(--yg-font-display); letter-spacing: -.01em; text-decoration: none; }
header .mark img { width: 22px; height: auto; }
nav { display: flex; align-items: center; gap: var(--yg-space-4); margin-left: auto; font-size: .875rem; }
nav a { display: inline-flex; align-items: center; gap: var(--yg-space-2);
  color: var(--yg-text-muted); text-decoration: none; }
nav a:hover, nav a[aria-current] { color: var(--yg-text); }
nav a[aria-current] { font-weight: 600; }

/* Icons carry no meaning alone, so they never stand in for a word, and they
   take the non-text colour the tokens reserve for exactly this. */
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none;
  stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; opacity: .75; }

h1 { font: 600 1.375rem/1.2 var(--yg-font-display); letter-spacing: -.02em;
  margin: 0 0 var(--yg-space-6); }
h2 { font: 600 .8125rem/1.3 var(--yg-font-text); letter-spacing: .06em;
  text-transform: uppercase; color: var(--yg-text-subtle);
  margin: var(--yg-space-10) 0 var(--yg-space-3); }
a { color: var(--yg-accent-text); }

/* A table is a grid; it does not need lines to prove it. One hairline under the
   head, and rows separated by space. */
table { border-collapse: collapse; width: 100%; font-size: .9375rem; }
th { text-align: left; font-weight: 600; font-size: .75rem; letter-spacing: .06em;
  text-transform: uppercase; color: var(--yg-text-subtle);
  padding: 0 var(--yg-space-4) var(--yg-space-2) 0;
  border-bottom: 1px solid var(--yg-border); }
td { padding: var(--yg-space-3) var(--yg-space-4) var(--yg-space-3) 0; vertical-align: top;
  border-bottom: 1px solid var(--yg-bg-subtle); }
tr:last-child td { border-bottom: 0; }
td a { text-decoration: none; color: var(--yg-text); font-weight: 500; }
td a:hover { color: var(--yg-accent-text); }

/* A card has a surface, so it does not also need a line around it. */
form.card { display: grid; gap: var(--yg-space-4); padding: var(--yg-space-6);
  background: var(--yg-surface); border-radius: var(--yg-radius-md); box-shadow: var(--yg-shadow-1); }
label { display: grid; gap: var(--yg-space-2); font-size: .8125rem; color: var(--yg-text-subtle); }
/* A qualifier belongs on the same line as what it qualifies, or it reads as a
   second thing to take in. */
label > .muted { font-size: inherit; }
label .line { display: flex; align-items: baseline; gap: var(--yg-space-2); }
input, select, textarea { font: inherit; padding: var(--yg-space-3);
  border: 1px solid var(--yg-border-strong); border-radius: var(--yg-radius-sm);
  background: var(--yg-surface); color: var(--yg-text); width: 100%; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible {
  outline: 2px solid var(--yg-focus); outline-offset: 2px; }
textarea { min-height: 5rem; resize: vertical; font-family: inherit; }
button { font: 600 inherit; cursor: pointer; padding: var(--yg-space-3) var(--yg-space-6);
  border: 0; border-radius: var(--yg-radius-sm);
  background: var(--yg-accent); color: var(--yg-on-accent); justify-self: start; }
button:hover { background: var(--yg-accent-hover); }
nav button { background: none; color: var(--yg-text-muted); padding: 0; font-weight: 400; }
nav button:hover { color: var(--yg-text); background: none; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: var(--yg-space-4); }

.state { font-size: .6875rem; letter-spacing: .04em; text-transform: uppercase;
  padding: 2px var(--yg-space-2); border-radius: var(--yg-radius-full); white-space: nowrap;
  background: var(--yg-bg-subtle); color: var(--yg-text-subtle); }
.passed  { background: var(--yg-success-surface); color: var(--yg-leaf-700); }
.failed, .interrupted { background: var(--yg-danger-surface); color: var(--yg-danger); }
.running, .queued { background: var(--yg-warning-surface); color: var(--yg-warning); }

pre { overflow-x: auto; padding: var(--yg-space-4); background: var(--yg-surface-sunken);
  border-radius: var(--yg-radius-sm); font: 12.5px/1.55 var(--yg-font-mono);
  white-space: pre-wrap; word-break: break-word; max-height: 30rem; }
.muted { color: var(--yg-text-muted); }

/* The catalog. One card a harness, and the difference between one this
   deployment can start and one it cannot is visible before either is read: a
   card you can start has a surface and no line, one you cannot has a line and
   no surface. */
.picks { display: grid; gap: var(--yg-space-4);
  grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); }
.pick { display: grid; gap: var(--yg-space-1); align-content: start; min-height: 6rem;
  padding: var(--yg-space-5); border-radius: var(--yg-radius-md);
  background: var(--yg-surface); box-shadow: var(--yg-shadow-1);
  color: inherit; text-decoration: none; }
.pick:hover { box-shadow: var(--yg-shadow-2); }
.pick .name { font: 600 1rem/1.2 var(--yg-font-display); letter-spacing: -.01em; }
.pick.off { background: none; box-shadow: none; border: 1px solid var(--yg-border); }
.pick.off .name { color: var(--yg-text-muted); }

/* A facts table is a label and a value, not a grid, so it carries no head rule
   and no row rules. */
table.facts { width: auto; margin-bottom: var(--yg-space-8); }
table.facts th { border: 0; padding-right: var(--yg-space-6); white-space: nowrap; }
table.facts td { border: 0; padding-left: 0; }

/* A turn is what you said and what came back. Yours sits in the accent
   surface, which is the one place a person's own words appear; the reply is
   the transcript, which is already set apart by being monospaced. */
.turn { margin-bottom: var(--yg-space-8); }
.said { margin: 0 0 var(--yg-space-3) auto; max-width: 42rem; width: fit-content;
  padding: var(--yg-space-3) var(--yg-space-4);
  background: var(--yg-accent-surface); color: var(--yg-text);
  border-radius: var(--yg-radius-md); white-space: pre-wrap; }
.turn pre { margin: 0; }
/* What a turn ended as, and the one way to the rest of it. A link at the end
   of a line somebody is not reading does not need underlining to be found. */
.after { display: flex; align-items: center; gap: var(--yg-space-3);
  margin: var(--yg-space-2) 0 0; font-size: .8125rem; }
.after a { color: var(--yg-text-muted); text-decoration: none; }
.after a:hover { color: var(--yg-accent-text); }

/* Where you are, above what you are reading. The instance is a link; the thread
   is where you already are, so it is not. */
.crumb { display: flex; gap: var(--yg-space-3); align-items: baseline;
  margin: 0 0 var(--yg-space-6); font-size: .9375rem; }
.crumb a { color: var(--yg-text); text-decoration: none; font-weight: 600; }
.crumb a:hover { color: var(--yg-accent-text); }
.refused { background: var(--yg-danger-surface); color: var(--yg-danger);
  padding: var(--yg-space-3) var(--yg-space-4); border-radius: var(--yg-radius-sm); }

@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; }
}
</style>
</head>
<body>
<header>
  <a class="mark" href="/"><img src="/static/mark.png" alt=""> haas</a>
  <nav>
    <a href="/"{{if eq .Nav "harnesses"}} aria-current="page"{{end}}>{{template "icon-harness"}} Harnesses</a>
    <a href="/jobs"{{if eq .Nav "jobs"}} aria-current="page"{{end}}>{{template "icon-jobs"}} Jobs</a>
    <a href="/spend"{{if eq .Nav "spend"}} aria-current="page"{{end}}>{{template "icon-spend"}} Spend</a>
    <form method="post" action="/logout"><button title="Sign out">{{template "icon-out"}}</button></form>
  </nav>
</header>
{{end}}

{{define "foot"}}</body></html>{{end}}

{{define "icon-harness"}}<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 2.5h4v4h-4zM9.5 2.5h4v4h-4zM2.5 9.5h4v4h-4zM9.5 9.5h4v4h-4z"/></svg>{{end}}
{{define "icon-jobs"}}<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h7"/></svg>{{end}}
{{define "icon-spend"}}<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v12M11 4.5H6.5a2 2 0 0 0 0 4h3a2 2 0 0 1 0 4H5"/></svg>{{end}}
{{define "icon-out"}}<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 13.5H3.5A1.5 1.5 0 0 1 2 12V4a1.5 1.5 0 0 1 1.5-1.5H6M10.5 11 14 8l-3.5-3M14 8H6"/></svg>{{end}}
