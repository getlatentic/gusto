{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<style>
:root { color-scheme: light dark; --edge: color-mix(in srgb, currentColor 15%, transparent); }
* { box-sizing: border-box; }
body { margin: 0 auto; padding: 1.5rem 1rem 4rem; max-width: 62rem;
  font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
header { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 1.5rem; }
header h1 { font-size: 1.1rem; margin: 0; letter-spacing: .01em; }
header nav { margin-left: auto; font-size: .85rem; }
a { color: inherit; }
h2 { font-size: .95rem; margin: 2rem 0 .6rem; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th { text-align: left; font-weight: 600; opacity: .6; font-size: .75rem;
  text-transform: uppercase; letter-spacing: .06em; }
th, td { padding: .45rem .6rem .45rem 0; border-bottom: 1px solid var(--edge); vertical-align: top; }
form.card { display: grid; gap: .75rem; padding: 1rem; border: 1px solid var(--edge); border-radius: 8px; }
label { display: grid; gap: .25rem; font-size: .8rem; opacity: .75; }
input, select, textarea, button { font: inherit; padding: .45rem .55rem; border-radius: 6px;
  border: 1px solid var(--edge); background: transparent; color: inherit; width: 100%; }
textarea { min-height: 4.5rem; resize: vertical; }
button { cursor: pointer; font-weight: 600; width: auto; justify-self: start; padding: .5rem 1.1rem; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: .75rem; }
.state { font-size: .72rem; letter-spacing: .05em; text-transform: uppercase;
  padding: .12rem .45rem; border-radius: 999px; border: 1px solid var(--edge); white-space: nowrap; }
.passed { color: #17803d; border-color: currentColor; }
.failed, .interrupted { color: #b3261e; border-color: currentColor; }
.running { color: #8a5a00; border-color: currentColor; }
pre { overflow-x: auto; padding: .8rem; border: 1px solid var(--edge); border-radius: 8px;
  font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap;
  word-break: break-word; max-height: 32rem; }
.muted { opacity: .6; }
.refused { border: 1px solid #b3261e; color: #b3261e; padding: .6rem .8rem; border-radius: 8px; }
ul.files { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: .4rem; font-size: .85rem; }
ul.files a { display: inline-block; padding: .2rem .55rem; border: 1px solid var(--edge); border-radius: 6px; text-decoration: none; }
</style>
</head>
<body>
<header>
  <h1><a href="/" style="text-decoration:none">haas</a></h1>
  <span class="muted">{{.Subtitle}}</span>
  <nav><form method="post" action="/logout" style="display:inline"><button>Sign out</button></form></nav>
</header>
{{end}}

{{define "foot"}}</body></html>{{end}}
