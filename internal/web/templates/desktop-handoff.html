<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="0;url={{.Link}}">
<title>gusto</title>
<link rel="icon" type="image/svg+xml" href="/static/mark.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="{{asset "/static/tokens.css"}}">
<link rel="stylesheet" href="{{asset "/static/fonts.css"}}">
<link rel="stylesheet" href="{{asset "/static/theme.css"}}">
<link rel="stylesheet" href="{{asset "/static/app.css"}}">
<script nonce="{{.Nonce}}">
  (function () {
    var root = document.documentElement, theme = "system", accent = "green";
    try { theme = localStorage.getItem("gusto-theme") || theme; accent = localStorage.getItem("gusto-accent") || accent; } catch (e) {}
    root.dataset.theme = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    root.dataset.accent = accent;
  })();
</script>
</head>
<body class="grid min-h-dvh place-items-center p-4">
<main class="grid w-full max-w-sm gap-5 rounded-lg bg-surface p-8 text-center shadow-2 dark:border dark:border-line">
  <h1 class="text-lg">You are signed in</h1>
  <p class="text-muted">Return to gusto to carry on. You can close this tab.</p>
  <a class="rounded-sm bg-solid px-3 py-3 font-semibold text-on-solid no-underline transition-colors hover:bg-solid-hover" href="{{.Link}}">Open gusto</a>
</main>
</body></html>
