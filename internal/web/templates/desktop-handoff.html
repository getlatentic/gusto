<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="0;url={{.Link}}">
<title>gusto</title>
<link rel="icon" type="image/svg+xml" href="/static/mark.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/tokens.css">
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; display: grid; place-items: center;
  background: var(--gu-bg); color: var(--gu-text); font: 0.8125rem/1.55 var(--gu-font-text); }
main { width: min(24rem, 92vw); display: grid; gap: var(--gu-space-5); text-align: center;
  padding: var(--gu-space-8); background: var(--gu-surface);
  border-radius: var(--gu-radius-lg); box-shadow: var(--gu-shadow-2); }
h1 { margin: 0; font: 600 1rem/1.3 var(--gu-font-display); }
p { margin: 0; color: var(--gu-text-muted); }
a.button { font-weight: 600; text-decoration: none; padding: var(--gu-space-3); border-radius: var(--gu-radius-sm);
  background: var(--gu-accent); color: var(--gu-on-accent); }
a.button:hover { background: var(--gu-accent-hover); }
a:focus-visible { outline: 0.125rem solid var(--gu-focus); outline-offset: 0.125rem; }
</style>
</head>
<body>
<main>
  <h1>You are signed in</h1>
  <p>Return to gusto to carry on. You can close this tab.</p>
  <a class="button" href="{{.Link}}">Open gusto</a>
</main>
</body></html>
