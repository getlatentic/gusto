<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="0;url={{.Link}}">
<title>Latentic Agent Cloud</title>
<link rel="icon" href="/static/mark.png">
<link rel="stylesheet" href="/static/tokens.css">
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; display: grid; place-items: center;
  background: var(--yg-bg); color: var(--yg-text); font: 0.9375rem/1.55 var(--yg-font-text); }
main { width: min(24rem, 92vw); display: grid; gap: var(--yg-space-5); text-align: center;
  padding: var(--yg-space-8); background: var(--yg-surface);
  border-radius: var(--yg-radius-lg); box-shadow: var(--yg-shadow-2); }
h1 { margin: 0; font: 600 1.125rem/1.3 var(--yg-font-display); }
p { margin: 0; color: var(--yg-text-muted); }
a.button { font-weight: 600; text-decoration: none; padding: var(--yg-space-3); border-radius: var(--yg-radius-sm);
  background: var(--yg-accent); color: var(--yg-on-accent); }
a.button:hover { background: var(--yg-accent-hover); }
a:focus-visible { outline: 0.125rem solid var(--yg-focus); outline-offset: 0.125rem; }
</style>
</head>
<body>
<main>
  <h1>You are signed in</h1>
  <p>Return to Latentic Agent Cloud to carry on. You can close this tab.</p>
  <a class="button" href="{{.Link}}">Open Latentic Agent Cloud</a>
</main>
</body></html>
