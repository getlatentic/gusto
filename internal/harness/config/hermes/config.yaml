# Copied into HERMES_HOME before each turn: hermes reads its model only from
# there, and that directory is the conversation's own, mounted over the image.
# key_env is honored only for the base_url written beside it, which is why the
# address is here and not in CUSTOM_BASE_URL.
model:
  provider: custom
  default: ${GUSTO_MODEL_ID}
  base_url: ${GUSTO_MODEL_URL}
  key_env: GUSTO_MODEL_TOKEN
# The folder every harness here shares for skills; a setup's skills are put
# there before each turn.
skills:
  external_dirs:
    - /root/.agents/skills
