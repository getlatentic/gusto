{{define "starting"}}{{template "head" .}}
  <header class="flex items-center justify-between">
    {{template "brand"}}
    <form method="post" action="/signout"><button class="rounded-sm border border-line-strong px-3 py-2 text-center text-muted hover:bg-wash hover:text-ink" type="submit">Sign out</button></form>
  </header>
  <h1 class="text-xl font-semibold">{{.Title}}</h1>
  <p class="inline-flex items-center gap-3 before:size-4 before:flex-none before:animate-spin before:rounded-full before:border-2 before:border-accent before:border-t-transparent before:content-['']" role="status">{{.Notice}}</p>
  <p class="text-sm text-muted">You go in as soon as it is ready. <a class="underline hover:text-ink" href="/org">Organization settings</a></p>
{{template "foot"}}{{end}}
