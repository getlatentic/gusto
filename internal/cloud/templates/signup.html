{{define "signup"}}{{template "head" .}}
  {{template "brand"}}
  <h1 class="text-xl font-semibold">Create your organization</h1>
  {{if .Error}}<p class="text-sm text-bad" role="alert">{{.Error}}</p>{{end}}
  {{if .Notice}}<p class="text-sm text-muted" role="status">{{.Notice}}</p>{{else}}{{if .GitHub}}<a class="flex items-center justify-center gap-2 rounded-sm border border-line-strong p-3 font-semibold hover:bg-surface" href="/signin/github"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/></svg>Continue with GitHub</a>
  <p class="text-center text-sm text-muted">or</p>{{end}}{{end}}
  <form class="grid gap-3" method="post" action="/signup">
    <label class="grid gap-1 text-sm text-muted">Work email <input class="w-full rounded-sm border border-line-strong bg-surface p-3 text-ink" type="email" name="email" value="{{.Email}}" autocomplete="email" autofocus required></label>
    {{if .More}}
    <label class="grid gap-1 text-sm text-muted">Organization name <input class="w-full rounded-sm border border-line-strong bg-surface p-3 text-ink" type="text" name="org" value="{{.OrgName}}" maxlength="80" autocomplete="organization" required></label>
    <label class="grid gap-1 text-sm text-muted">Address <input class="w-full rounded-sm border border-line-strong bg-surface p-3 text-ink" type="text" name="slug" value="{{.Slug}}" maxlength="32" autocomplete="off" placeholder="made from the name"></label>
    {{end}}
    <button class="cursor-pointer rounded-sm bg-solid p-3 text-center font-semibold text-on-solid hover:bg-solid-hover" type="submit">Create organization</button>
  </form>
  <p class="text-center text-sm text-muted">Already have one? <a class="underline" href="/signin">Sign in</a></p>
{{template "foot"}}{{end}}
