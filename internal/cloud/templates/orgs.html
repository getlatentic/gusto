{{define "orgs"}}{{template "head" .}}
  <header class="flex items-center justify-between">
    {{template "brand"}}
    <form method="post" action="/signout"><button class="rounded-sm border border-line-strong px-3 py-2 text-center text-muted hover:bg-wash hover:text-ink" type="submit">Sign out</button></form>
  </header>
  <h1 class="text-xl font-semibold">Choose an organization</h1>
  <p class="text-muted">{{.Email}} is in {{len .Orgs}} organizations.</p>
  <ul class="grid gap-2">
    {{range .Orgs}}<li class="flex items-center gap-3 rounded-sm border border-line-strong hover:bg-wash"><a class="grid flex-1 gap-1 p-3 no-underline" href="/open?org={{.Slug}}"><span class="font-semibold text-ink wrap-anywhere">{{.Name}}</span><span class="text-sm text-muted wrap-anywhere">{{.Slug}}.{{$.Address}}</span></a><a class="p-3 text-sm text-muted underline hover:text-ink" href="/org?org={{.Slug}}" aria-label="{{.Name}} settings">Settings</a></li>{{end}}
  </ul>
{{template "foot"}}{{end}}
