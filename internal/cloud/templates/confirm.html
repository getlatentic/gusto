{{define "confirm"}}{{template "head" .}}
  {{template "brand"}}
  <h1 class="text-xl font-semibold">{{.Title}}</h1>
  {{if .Inviter}}<p class="text-sm text-muted">{{.Inviter}} invited you.</p>{{end}}
  <form class="grid gap-3" method="post" action="{{.Action}}" data-once>
    <input type="hidden" name="t" value="{{.Token}}">
    <button class="cursor-pointer rounded-sm bg-solid p-3 text-center font-semibold text-on-solid hover:bg-solid-hover aria-disabled:cursor-default aria-disabled:opacity-60" type="submit" data-busy="Just a moment…">{{.Button}}</button>
  </form>
  <script src="{{own "/static/once.js"}}" defer></script>
{{template "foot" .}}{{end}}
