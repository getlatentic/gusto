[package]
name = "latentic-agent-cloud"
version = "0.1.0"
description = "The window, the tray and the notifications for Latentic Agent Cloud. The work is done by gusto-helper, which this starts."
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "latentic_agent_cloud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
url = "2"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# A notification is sent by what each system offers, since a click on it has to bring the window to the turn, which no one crate does on all three.
[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
tauri-winrt-notification = "0.7"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
notify-rust = "4"
