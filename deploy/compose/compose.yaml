# haas on one Linux machine: the server, the proxy inside it, and the runner
# image it starts one container from per job. README.md beside this file is the
# path to follow, and deploy/README.md says what the runtime socket below gives
# the server.
#
#   cp env.example .env     # then set HAAS_PASSWORD
#   docker compose up -d --build
#
# Settings come from .env, which is gitignored at the repository root.

name: haas

services:
  # The runner is not a service that stays up: the server starts a fresh
  # container from this image for every job and destroys it afterwards. Compose
  # builds the image and runs it once with `harnesses`, so an image that cannot
  # start stops the install here rather than at somebody's first job.
  runner:
    image: ${HAAS_RUNNER_IMAGE:-haas-runner:local}
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        HARNESSES: ${HAAS_RUNNER_HARNESSES:-opencode=opencode-ai}
        MCP_SERVERS: ${HAAS_RUNNER_MCP:-}
      # The root Dockerfile names its bases by tag. A named context replaces
      # what a FROM line resolves to, so this install builds the same file from
      # bases pinned by digest without changing it. A key is the FROM line's
      # image as Docker shortens it: docker.io/library/golang:1.26 is golang:1.26.
      additional_contexts:
        "golang:1.26": docker-image://docker.io/library/golang:1.26@sha256:6c2a5538f964f1c82f97ad14988bf05de100d922d159d0e398b54c7b0ca0c6c9
        "node:24-slim": docker-image://docker.io/library/node:24-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
    command: ["harnesses"]
    network_mode: none
    restart: "no"

  server:
    image: ${HAAS_SERVER_IMAGE:-haas-server:local}
    build:
      context: ../..
      dockerfile: deploy/server/Dockerfile
    depends_on:
      runner:
        condition: service_completed_successfully
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      # What the install decides, so .env cannot move it out from under the
      # mounts below.
      HAAS_ADDR: 0.0.0.0:8040
      HAAS_CONTAINER: docker
      HAAS_IMAGE: ${HAAS_RUNNER_IMAGE:-haas-runner:local}
      HAAS_JOBS: ${HAAS_DATA:-/var/lib/haas}/jobs
      HAAS_SESSIONS: ${HAAS_DATA:-/var/lib/haas}/sessions
      HAAS_SETUPS: ${HAAS_DATA:-/var/lib/haas}/setups
      HAAS_CHANGES: ${HAAS_DATA:-/var/lib/haas}/changes/changes.jsonl
      HAAS_RETENTION: ${HAAS_DATA:-/var/lib/haas}/retention
      HAAS_COMPARISONS: ${HAAS_DATA:-/var/lib/haas}/comparisons
      DOCKER_HOST: unix:///run/haas/runtime.sock
    ports:
      # Loopback by default: the shared password travels in the clear over
      # plain HTTP, so something that terminates TLS goes in front.
      - ${HAAS_PUBLISH:-127.0.0.1:8040}:8040
    volumes:
      # The same path on both sides, and that is required. The server names a
      # job's directory, a conversation's workspace and the proxy's socket to
      # the runtime by the path it sees, and the runtime resolves that path on
      # the host.
      - type: bind
        source: ${HAAS_DATA:-/var/lib/haas}
        target: ${HAAS_DATA:-/var/lib/haas}
        bind:
          create_host_path: true
      # The host's container runtime. Whoever holds this socket can start a
      # privileged container and so holds root on the host: this is the trade
      # deploy/README.md names, not a safe default.
      - type: bind
        source: ${HAAS_RUNTIME_SOCKET:-/var/run/docker.sock}
        target: /run/haas/runtime.sock
    healthcheck:
      # bash, because the image carries no HTTP client and /dev/tcp is bash's.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8040 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '^ok' <&3"]
      interval: 10s
      timeout: 5s
      retries: 6
