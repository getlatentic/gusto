---

# Skipped when smoke is false.
# A deploy that cannot run a job has not finished. This runs one, in a container,
# on this box, and checks its own evidence — the same three commands a person
# would use, so nothing here is a special path.
#
# It proves the candidate binary and the candidate image, not the live ones. A
# failure here ends the play before the release role, so what the server runs
# stays what it ran before the deploy began.
- name: The smoke directories
  ansible.builtin.file:
    path: "{{ app_root }}/var/smoke/{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0750"
  loop:
    - repo
    - harnesses

# The fixture belongs to the smoke test and to nothing else. The server offers
# whatever it finds in harnesses_dir, so a fixture left there is a harness the
# pages offer and a job that proves nothing by passing.
# absent names a program no image carries, which is what a job on a harness the
# image was not built with looks like from inside the box.
# smoke_fixture chooses the file behind the fixture harness. broken.json changes
# nothing, so the gate fails, and that is how a person proves a failing smoke job
# keeps the previous version running.
- name: The smoke test's harnesses, where only the smoke test looks
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ app_root }}/var/smoke/harnesses/{{ item.dest }}"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0640"
  loop:
    - { src: "{{ smoke_fixture }}", dest: fixture.json }
    - { src: absent.json, dest: absent.json }
  loop_control:
    label: "{{ item.dest }} from {{ item.src }}"

- name: No smoke harness where the server looks
  ansible.builtin.file:
    path: "{{ harnesses_dir }}/{{ item }}"
    state: absent
  loop:
    - fixture.json
    - absent.json

- name: A repository whose test fails until the job fixes it
  ansible.builtin.copy:
    dest: "{{ app_root }}/var/smoke/repo/{{ item.name }}"
    content: "{{ item.body }}"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"
  loop:
    - name: adder.sh
      body: "add() {\n  echo $(( $1 - $2 ))\n}\n"
    - name: test.sh
      body: "#!/bin/sh\n. ./adder.sh\nresult=$(add 2 3)\n[ \"$result\" = 5 ] && { echo ok; exit 0; }\necho \"add 2 3 gave $result, not 5\"\nexit 1\n"
  loop_control:
    label: "{{ item.name }}"

- name: The repository is a repository
  ansible.builtin.shell:
    cmd: git init -q . && git add -A && git -c user.email=haas@localhost -c user.name=haas commit -qm "an adder that subtracts"
    chdir: "{{ app_root }}/var/smoke/repo"
    creates: "{{ app_root }}/var/smoke/repo/.git"
  become_user: "{{ app_user }}"

# A fresh job each deploy: the point is whether this build runs one, not whether
# an old directory is still there.
- name: Last deploy's jobs removed
  ansible.builtin.file:
    path: "{{ app_root }}/var/smoke/{{ item }}"
    state: absent
  loop:
    - job
    - refused

- name: A job, described the way a person would
  ansible.builtin.command:
    cmd: >-
      {{ candidate_bin }} new {{ app_root }}/var/smoke/job
      -repo {{ app_root }}/var/smoke/repo
      -brief "make add add"
      -harness fixture
      -- sh test.sh
  become_user: "{{ app_user }}"
  environment:
    HOME: "{{ app_root }}"
    GUSTO_HARNESSES: "{{ app_root }}/var/smoke/harnesses"
  changed_when: true

- name: The job runs in a container and passes its gate
  ansible.builtin.command:
    cmd: "{{ candidate_bin }} run {{ app_root }}/var/smoke/job"
  become_user: "{{ app_user }}"
  environment:
    HOME: "{{ app_root }}"
    GUSTO_CONTAINER: "{{ container_runtime }}"
    GUSTO_IMAGE: "{{ candidate_image }}"
    GUSTO_JOB_MEMORY: "{{ job_memory }}"
    GUSTO_JOB_CPUS: "{{ job_cpus }}"
    GUSTO_SIGNER: "greencloud"
  changed_when: true

- name: Its evidence agrees with itself
  ansible.builtin.command:
    cmd: "{{ candidate_bin }} verify {{ app_root }}/var/smoke/job"
  become_user: "{{ app_user }}"
  environment:
    HOME: "{{ app_root }}"
  changed_when: false
  register: verified

# The fixture also tries to write into the record. The runner gives the
# harness a user of its own and keeps out/ to itself, so the attempt is refused;
# an image that lets it through fails the deploy here, because the manifest
# would hash the forged line and verify would pass.
- name: The harness could not write the record
  ansible.builtin.command:
    cmd: grep -q forged-by-the-harness {{ app_root }}/var/smoke/job/out/transcript.log
  become_user: "{{ app_user }}"
  register: forged
  failed_when: forged.rc != 1
  changed_when: false

- name: What the deploy proved
  ansible.builtin.debug:
    var: verified.stdout

# A job on a harness the image lacks has to stop before the harness starts and
# say why where the job page shows it, rather than start, fail to find its
# program, and read as the harness failing.
- name: A job on a harness the image does not carry
  ansible.builtin.command:
    cmd: >-
      {{ candidate_bin }} new {{ app_root }}/var/smoke/refused
      -repo {{ app_root }}/var/smoke/repo
      -brief "make add add"
      -harness absent
      -- sh test.sh
  become_user: "{{ app_user }}"
  environment:
    HOME: "{{ app_root }}"
    GUSTO_HARNESSES: "{{ app_root }}/var/smoke/harnesses"
  changed_when: true

- name: It is refused before it starts
  ansible.builtin.command:
    cmd: "{{ candidate_bin }} run {{ app_root }}/var/smoke/refused"
  become_user: "{{ app_user }}"
  environment:
    HOME: "{{ app_root }}"
    GUSTO_CONTAINER: "{{ container_runtime }}"
    GUSTO_IMAGE: "{{ candidate_image }}"
    GUSTO_JOB_MEMORY: "{{ job_memory }}"
    GUSTO_JOB_CPUS: "{{ job_cpus }}"
  register: refusal
  changed_when: true
  failed_when: refusal.rc == 0

- name: And says why where the job page shows it
  ansible.builtin.command:
    cmd: >-
      grep -F "does not carry haas-smoke-harness-nobody-installed"
      {{ app_root }}/var/smoke/refused/out/transcript.log
  become_user: "{{ app_user }}"
  changed_when: false
