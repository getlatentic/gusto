---
# The names a box carried before this deployment was called gusto. tasks/main.yml
# moves each of them to its current name and nothing else.
legacy_name: haas
legacy_user: haas
legacy_root: /opt/haas
legacy_deploy_user: haas-deploy
legacy_deploy_home: /var/lib/haas-deploy
legacy_deploy_root: /opt/haas-deploy
legacy_deploy_etc: /etc/haas-deploy
legacy_errors_dir: /var/www/haas-errors
legacy_service_unit: /etc/systemd/system/haas.service
legacy_deploy_unit: /etc/systemd/system/haas-deploy@.service

# Whatever of the old deployment may be on a box. The two unit files are
# removed last, so a run that stopped halfway still sees the old deployment
# and resumes.
legacy_paths:
  - "{{ legacy_service_unit }}"
  - "{{ legacy_deploy_unit }}"
  - "{{ legacy_root }}"
  - "{{ legacy_deploy_root }}"
  - "{{ legacy_deploy_etc }}"
