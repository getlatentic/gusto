---
# A pinned Go, under the app root. The box has a shared /usr/local/go that
# belongs to whoever installed it, and depending on its version would make this
# deploy depend on somebody else's upgrade.
- name: Go tarball
  ansible.builtin.get_url:
    url: "https://go.dev/dl/go{{ go_version }}.linux-amd64.tar.gz"
    dest: "{{ app_root }}/go{{ go_version }}.tar.gz"
    checksum: "{{ ('sha256:' + go_sha256) if go_sha256 else omit }}"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0644"

# Asked of the installed toolchain alone (GOTOOLCHAIN=local), so it says what is
# on disk and not what Go would fetch to satisfy go.mod.
- name: Which Go is installed
  ansible.builtin.command:
    cmd: "{{ app_root }}/go/bin/go version"
  environment:
    GOTOOLCHAIN: local
    GOROOT: "{{ app_root }}/go"
  register: installed_go
  changed_when: false
  failed_when: false

# A version that is not the pinned one is replaced whole, so no file of the old
# one is left among the new.
- name: An installed Go that is not the pinned one, removed
  ansible.builtin.file:
    path: "{{ app_root }}/go"
    state: absent
  when: "('go' + go_version + ' ') not in (installed_go.stdout | default('')) "

- name: Go unpacked
  ansible.builtin.unarchive:
    src: "{{ app_root }}/go{{ go_version }}.tar.gz"
    dest: "{{ app_root }}"
    remote_src: true
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    creates: "{{ app_root }}/go/bin/go"

# Built beside the live binary, never over it. The release role promotes it only
# once everything that proves it has passed, so a build that fails its smoke job
# leaves the running version exactly where it was.
- name: Build the candidate binary
  ansible.builtin.command:
    cmd: "{{ app_root }}/go/bin/go build -trimpath -o {{ candidate_bin }} ./cmd/gusto"
    chdir: "{{ app_root }}/src"
  become_user: "{{ app_user }}"
  environment:
    HOME: "{{ app_root }}"
    GOCACHE: "{{ app_root }}/var/go-cache"
    GOMODCACHE: "{{ app_root }}/var/go-mod"
    # The pinned Go builds, or the build fails: a toolchain fetched from the
    # network to satisfy go.mod is one nobody pinned or checked.
    GOTOOLCHAIN: local
  register: build
  changed_when: true

- name: The candidate answers
  ansible.builtin.command:
    cmd: "{{ candidate_bin }} harnesses"
  become_user: "{{ app_user }}"
  changed_when: false
  register: harnesses

- name: Harnesses this build knows
  ansible.builtin.debug:
    var: harnesses.stdout_lines
