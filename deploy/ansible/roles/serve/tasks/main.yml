---
# Off until there is an HTTP server in the binary. Everything above this role
# gives the box a working runner, which is useful on its own.
# Rootless podman needs the user's runtime directory, which is named by its
# numeric id and created by the lingering session the sandbox role enabled.
- name: The app user's entry
  ansible.builtin.getent:
    database: passwd
    key: "{{ app_user }}"
  when: serve_enabled | bool

- name: Its numeric id
  ansible.builtin.set_fact:
    app_uid: "{{ ansible_facts.getent_passwd[app_user][1] }}"
  when: serve_enabled | bool

- name: The credentials directory
  ansible.builtin.file:
    path: "{{ app_root }}/var/credentials"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0700"
  when: credentials | length > 0

# no_log, because the content is a key. That file is the only place it lands.
- name: A credential a job may spend
  ansible.builtin.copy:
    dest: "{{ app_root }}/var/credentials/{{ item.name }}.json"
    content: |
      {{ {'address': item.address,
          'auth': item.auth | default('bearer'),
          'harnesses': item.harnesses | default([]),
          'key': lookup('vars', item.key_var)} | to_nice_json }}
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0600"
  loop: "{{ credentials }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  notify: Restart haas

# The key that signs every record. It is made on the box, the first time,
# and never leaves it: the public half goes in the keyring the server names
# signers by, and anyone who verifies a record needs only that.
- name: The signing directories
  ansible.builtin.file:
    path: "{{ app_root }}/var/{{ item.name }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { name: signing, mode: "0700" }
    - { name: keyring, mode: "0755" }
    - { name: github, mode: "0700" }
    - { name: changes, mode: "0750" }
    - { name: tokens, mode: "0700" }
    - { name: retention, mode: "0750" }

- name: The signing key
  ansible.builtin.command:
    cmd: "{{ live_bin }} keygen {{ signer_name }} -dir {{ app_root }}/var/signing"
    creates: "{{ app_root }}/var/signing/{{ signer_name }}.key"
  become_user: "{{ app_user }}"
  notify: Restart haas

- name: The signing key's public half, in the keyring
  ansible.builtin.copy:
    src: "{{ app_root }}/var/signing/{{ signer_name }}.pub"
    dest: "{{ app_root }}/var/keyring/{{ signer_name }}.pub"
    remote_src: true
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0644"
  notify: Restart haas

# How long finished work is kept. The file is the operator's setting, so the
# playbook owns it; the holds and the last sweep beside it are the server's.
- name: The retention policy
  ansible.builtin.copy:
    content: "{{ retention_policy | to_nice_json }}\n"
    dest: "{{ app_root }}/var/retention/policy.json"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0640"
  notify: Restart haas

# The record of what changes on the platform. The server opens it to append, and
# where the filesystem allows it the file is made append-only, so not even the
# user the server runs as can rewrite or shorten it.
- name: The change log's file
  ansible.builtin.copy:
    content: ""
    dest: "{{ app_root }}/var/changes/changes.jsonl"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0600"
    force: false

- name: The change log takes appends only
  ansible.builtin.file:
    path: "{{ app_root }}/var/changes/changes.jsonl"
    attributes: "+a"
  register: append_only
  failed_when: false

- name: Say when the change log could not be made append-only
  ansible.builtin.debug:
    msg: "the change log is hash-chained and signed, but this filesystem would not make it append-only: {{ append_only.msg | default('') }}"
  when: append_only is failed or (append_only.failed | default(false))

# The App's key is the one long-lived secret for reaching repositories: every
# token a job gets is minted from it, for one repository, and revoked after. The
# server reads it; the boxes jobs run in never do.
- name: The GitHub App's private key
  ansible.builtin.copy:
    content: "{{ github_app_private_key }}\n"
    dest: "{{ app_root }}/var/github/app.pem"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0600"
  no_log: true
  when: github_app_id | length > 0
  notify: Restart haas

- name: The MCP servers directory
  ansible.builtin.file:
    path: "{{ app_root }}/var/mcp"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: An MCP server a setup may choose
  ansible.builtin.copy:
    dest: "{{ app_root }}/var/mcp/{{ item.name }}.json"
    content: "{{ item | dict2items | rejectattr('key', 'equalto', 'name') | items2dict | to_nice_json }}\n"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0644"
  loop: "{{ mcp_servers }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Restart haas

# Prices and team caps. A model it leaves out is counted in tokens and shown
# as unpriced, which is not the same as free.
- name: The spend policy
  ansible.builtin.copy:
    dest: "{{ app_root }}/var/spend.json"
    content: "{{ spend_policy | to_nice_json }}\n"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0644"
  when: spend_policy is defined
  notify: Restart haas

- name: The service environment
  ansible.builtin.template:
    src: haas.env.j2
    dest: "{{ app_root }}/var/haas.env"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0600"
  when: serve_enabled | bool
  notify: Restart haas

- name: The service unit
  ansible.builtin.template:
    src: haas.service.j2
    dest: /etc/systemd/system/haas.service
    mode: "0644"
  when: serve_enabled | bool
  notify:
    - Reload systemd
    - Restart haas

- name: The service is running and enabled
  ansible.builtin.systemd:
    name: haas
    state: started
    enabled: true
    daemon_reload: true
  when: serve_enabled | bool

# The restart a promotion asked for happens here rather than at the end of the
# play, so the version that just became live is checked while the one it
# replaced is still on disk to go back to.
- name: Pending restarts, applied
  ansible.builtin.meta: flush_handlers

# Smoke proved the candidate can run a job; this proves the promoted server
# starts and answers. A server that does not is replaced by the previous
# version, and the deploy still fails, so nobody reads a rollback as a success.
- name: The live version answers, or the previous one comes back
  when: serve_enabled | bool
  block:
    # Ready, and not only alive: the workers are running and the jobs can be
    # written, so a version whose queue is dead does not pass and stay promoted.
    - name: The service answers on its own port
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ backend_port }}/readyz"
        return_content: true
      register: health
      until: health.status == 200
      retries: "{{ health_retries }}"
      delay: "{{ health_delay }}"
  rescue:
    - name: The previous version, restored
      ansible.builtin.include_role:
        name: release
        tasks_from: restore
      vars:
        restore_bin: "{{ promoted_bin | default(false) }}"
        restore_image: "{{ promoted_image | default(false) }}"

    - name: The deploy fails, whatever the rollback did
      ansible.builtin.fail:
        msg: >-
          The version this deploy promoted did not answer /readyz on
          127.0.0.1:{{ backend_port }}.
          {{ 'The previous binary is live again.' if (promoted_bin | default(false) | bool)
             else 'This deploy promoted no binary, so the server was failing before it.' }}
          Read `journalctl -u haas` for why it would not start.

# The box keeps a curated note of what runs on it, and it is the first thing
# anybody deploying here reads. A deploy that changes ports or databases and
# leaves that note stale is how the next person collides with this app.
- name: The box's inventory note says what haas holds
  ansible.builtin.blockinfile:
    path: /opt/INVENTORY.md
    marker: "<!-- {mark} haas (managed by haas/deploy/ansible) -->"
    create: false
    block: |
      ## haas (repo getlatentic/haas)

      | thing | value |
      |---|---|
      | services | `haas` (user `haas`, not www-data: rootless podman needs a subuid range and a home) |
      | port | {{ backend_port }} (lo) |
      | vhost | {{ server_name }} |
      | state | job directories under `{{ app_root }}/var/jobs`; MySQL `{{ db_name }}` and Redis db{{ redis_db }} are claimed and currently unused |
      | containers | rootless `podman` as `haas`; one job at a time takes {{ job_memory }} and {{ job_cpus }} CPU, {{ job_concurrency }} at once |
      | toolchain | its own Go under `{{ app_root }}/go`; does not use the shared `/usr/local/go` |
  when: serve_enabled | bool
  failed_when: false
