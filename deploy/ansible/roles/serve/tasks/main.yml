---
# Off until there is an HTTP server in the binary. Everything above this role
# gives the box a working runner, which is useful on its own.
# Rootless podman needs the user's runtime directory, which is named by its
# numeric id and created by the lingering session the sandbox role enabled.
- name: The app user's entry
  ansible.builtin.getent:
    database: passwd
    key: "{{ app_user }}"
  when: serve_enabled | bool

- name: Its numeric id
  ansible.builtin.set_fact:
    app_uid: "{{ ansible_facts.getent_passwd[app_user][1] }}"
  when: serve_enabled | bool

- name: The service environment
  ansible.builtin.template:
    src: haas.env.j2
    dest: "{{ app_root }}/var/haas.env"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0600"
  when: serve_enabled | bool
  notify: Restart haas

- name: The service unit
  ansible.builtin.template:
    src: haas.service.j2
    dest: /etc/systemd/system/haas.service
    mode: "0644"
  when: serve_enabled | bool
  notify:
    - Reload systemd
    - Restart haas

- name: The service is running and enabled
  ansible.builtin.systemd:
    name: haas
    state: started
    enabled: true
    daemon_reload: true
  when: serve_enabled | bool

# The box keeps a curated note of what runs on it, and it is the first thing
# anybody deploying here reads. A deploy that changes ports or databases and
# leaves that note stale is how the next person collides with this app.
- name: The box's inventory note says what haas holds
  ansible.builtin.blockinfile:
    path: /opt/INVENTORY.md
    marker: "<!-- {mark} haas (managed by haas/deploy/ansible) -->"
    create: false
    block: |
      ## haas (repo getlatentic/haas)

      | thing | value |
      |---|---|
      | services | `haas` (user `haas`, not www-data: rootless podman needs a subuid range and a home) |
      | port | {{ backend_port }} (lo) |
      | vhost | {{ server_name }} |
      | state | job directories under `{{ app_root }}/var/jobs`; MySQL `{{ db_name }}` and Redis db{{ redis_db }} are claimed and currently unused |
      | containers | rootless `podman` as `haas`; one job at a time takes {{ job_memory }} and {{ job_cpus }} CPU, {{ job_concurrency }} at once |
      | toolchain | its own Go under `{{ app_root }}/go`; does not use the shared `/usr/local/go` |
  when: serve_enabled | bool
  failed_when: false
