---
# Off until there is an HTTP server in the binary. Everything above this role
# gives the box a working runner, which is useful on its own.
# Rootless podman needs the user's runtime directory, which is named by its
# numeric id and created by the lingering session the sandbox role enabled.
- name: The app user's entry
  ansible.builtin.getent:
    database: passwd
    key: "{{ app_user }}"
  when: serve_enabled | bool

- name: Its numeric id
  ansible.builtin.set_fact:
    app_uid: "{{ ansible_facts.getent_passwd[app_user][1] }}"
  when: serve_enabled | bool

- name: The service environment
  ansible.builtin.template:
    src: haas.env.j2
    dest: "{{ app_root }}/var/haas.env"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0600"
  when: serve_enabled | bool
  notify: Restart haas

- name: The service unit
  ansible.builtin.template:
    src: haas.service.j2
    dest: /etc/systemd/system/haas.service
    mode: "0644"
  when: serve_enabled | bool
  notify:
    - Reload systemd
    - Restart haas

- name: The service is running and enabled
  ansible.builtin.systemd:
    name: haas
    state: started
    enabled: true
    daemon_reload: true
  when: serve_enabled | bool
