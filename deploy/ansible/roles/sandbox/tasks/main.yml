---
# podman rather than docker: no daemon, so nothing is resident between jobs, and
# no iptables rules are rewritten on a box whose nginx fronts other sites.
# uidmap carries newuidmap/newgidmap, which rootless containers need.
- name: podman and the rootless helpers
  ansible.builtin.apt:
    name:
      - podman
      - uidmap
      - slirp4netns
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: A subuid range for the app user
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    regexp: "^{{ app_user }}:"
    line: "{{ app_user }}:565536:65536"
    create: true
    mode: "0644"
  loop:
    - /etc/subuid
    - /etc/subgid

# A user service has to keep running when nobody is logged in.
- name: The app user's session lingers
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ app_user }}"
    creates: "/var/lib/systemd/linger/{{ app_user }}"

# Tagged as the candidate, so jobs the live server starts meanwhile keep the
# image they were deployed with. The release role moves the live tag.
- name: The candidate runner image
  ansible.builtin.command:
    cmd: >-
      {{ container_runtime }} build
      --build-arg {{ ('HARNESSES=' ~ (runner_harnesses | join(' '))) | quote }}
      --build-arg {{ ('MCP_SERVERS=' ~ (runner_mcp_packages | join(' '))) | quote }}
      -t {{ candidate_image }} .
    chdir: "{{ app_root }}/src"
  become_user: "{{ app_user }}"
  environment:
    HOME: "{{ app_root }}"
  register: image
  changed_when: "'Successfully tagged' in image.stdout or 'COMMIT' in image.stdout"

- name: The runtime can start the candidate
  ansible.builtin.command:
    cmd: "{{ container_runtime }} run --rm {{ candidate_image }} agents"
    chdir: "{{ app_root }}"
  become_user: "{{ app_user }}"
  environment:
    HOME: "{{ app_root }}"
  changed_when: false

# Read back from the image rather than from the variable, so a build that did
# not take the list shows here and not at somebody's first job.
- name: What the candidate image carries
  ansible.builtin.command:
    cmd: >-
      {{ container_runtime }} image inspect
      --format '{{ '{{' }} index .Config.Labels "com.getlatentic.haas.harnesses" {{ '}}' }}'
      {{ candidate_image }}
  become_user: "{{ app_user }}"
  environment:
    HOME: "{{ app_root }}"
  register: carried
  changed_when: false
  failed_when: carried.rc != 0 or (carried.stdout | trim) != (runner_harnesses | join(' '))
