---
# greencloud (203.0.113.10) — a SHARED box. It already runs other sites with their
# own databases, MySQL, PostgreSQL, Redis and nginx. gusto coexists: its own user, its own port, its own vhost, and nothing else
# touched.
#
# Measured on 2026-09-26, before any of this: 4 vCPU, 7894 MB of memory with
# 3100 MB available, 4095 MB of swap, 58 GB of disk with 25 GB free, load 0.00.
# An opencode job peaked at 663 MiB in its container, so two at a time is about
# 1.8 GB of the 3.1 GB that is free. That is where job_concurrency comes from.
job_concurrency: 2
serve_enabled: true
job_memory: 900m

# :8000, :8010, :8020, :8021, :8030 and :8081 are taken by the other apps.
backend_port: 8040

# The box's own MySQL and Redis, claimed the way every other app here claims
# them: one database, one user granted on `gusto.*` and nothing else, and Redis
# db4 because db0 to db3 are in use. Neither service is installed or
# reconfigured by this playbook, and no other app's database, user or index is
# touched. db_password lives in greencloud.vault.yml.
store: mysql
db_name: gusto
db_user: gusto
redis_db: 4

# The model this box thinks with. An OpenAI-compatible endpoint with a bearer
# token, so the proxy adds the credential the same way it would for any other:
# the container is given a per-job token and never the key. The address is the
# root, because the container supplies the rest of the path.
# Measured on 2026-09-26: this endpoint serves 58 models, but only the
# open-weights ones are licensed here. It answers /v1/chat/completions and
# /v1/responses; the anthropic.* models it lists refuse both.
credentials:
  - name: platform
    address: "https://bedrock-mantle.us-east-1.api.aws"
    auth: bearer
    key_var: model_key
  # Measured on 2026-09-26: serves deepseek-flash and deepseek-v4-pro, and
  # implements the responses API, which is the only wire codex still speaks.
  - name: deepseek
    address: "https://api.deepseek.com"
    auth: bearer
    key_var: deepseek_key
  # The same provider, in Anthropic's shape, which is the only wire Claude Code
  # speaks. Measured on 2026-09-27: /anthropic/v1/messages answers with a real
  # Anthropic-shaped message. bedrock-mantle serves that path too and refuses
  # its anthropic.* models as unlicensed for this account.
  - name: anthropic
    address: "https://api.deepseek.com/anthropic"
    auth: anthropic
    key_var: deepseek_key

# Every engine is offered every model, and the first is the one an agent is
# started on when nobody chose, so the order is the choice: DeepSeek Flash finished every conversation measured on
# 2026-09-27, and Qwen 3 VL, a vision model, answered opencode's first
# message with "Please try again".
models: "deepseek/deepseek-flash,anthropic/deepseek-flash,deepseek/deepseek-v4-pro,anthropic/deepseek-v4-pro,platform/qwen.qwen3-vl-235b-a22b-instruct"

# DeepSeek's published prices, read from api-docs.deepseek.com/quick_start/pricing
# on 2026-09-27: US dollars a million tokens at the off-peak rate, doubled on
# weekdays from 01:00 to 04:00 and 06:00 to 10:00 UTC except on Chinese public
# holidays, which go in `except` as DeepSeek announces them. Both credentials
# reach the same account, so a price named by the model alone covers both. The
# qwen model on the platform credential has no price here: its tokens are
# counted and its cost is shown as unknown.
deepseek_peak: &deepseek_peak
  multiplier: 2
  weekdays: [1, 2, 3, 4, 5]
  hoursUtc: [[1, 4], [6, 10]]
  except: []
spend_policy:
  prices:
    deepseek-flash:
      inputPerMillion: 0.15
      cachedInputPerMillion: 0.003
      outputPerMillion: 0.6
      peak: *deepseek_peak
    deepseek-v4-pro:
      inputPerMillion: 0.66
      cachedInputPerMillion: 0.022
      outputPerMillion: 1.98
      peak: *deepseek_peak
    # aws.amazon.com/bedrock/pricing lists this model at these rates in
    # Mumbai, Ireland and Milan, and does not list us-east-1, where the
    # platform credential reaches it; the lowest listed rate is used until it
    # does.
    qwen.qwen3-vl-235b-a22b-instruct:
      inputPerMillion: 0.53
      outputPerMillion: 2.66
  teams: {}

# ufw is active and default-deny, and already allows nginx. The service binds
# localhost, so there is no rule to add.

# Sign-in is Google, and two addresses: the owner, who is an admin, and a second
# person who is not, so what one sees of the other's work can be checked. The
# app is in testing mode with those addresses as its only test users, so the
# provider refuses anybody else before this server is even asked.
oidc_issuer: "https://accounts.google.com"
oidc_allowed: "tosinamuda@gmail.com,amudatosin@gmail.com"
gusto_admins: "tosinamuda@gmail.com"

# Autodeploy stays off here until its key exists. To turn it on, put the public
# half of the key GitHub holds in autodeploy_public_key, set autodeploy_enabled,
# and run the playbook once by hand; README.md has the steps.
autodeploy_enabled: true
autodeploy_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIISdoI6zBtx+cnKvjxpnQ7zp35CLRg/AcjhsZz0NRC3k gusto-deploy, asks greencloud to deploy a commit on main"
