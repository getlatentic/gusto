---
# greencloud (91.109.118.72) — a SHARED box. It already runs closer, lpcg,
# fungifting, voice-telco with its SIP and RTP ports, graspy, a WordPress site,
# a Label Studio behind a Cloudflare tunnel, MySQL, PostgreSQL, Redis and nginx.
# haas coexists: its own user, its own port, its own vhost, and nothing else
# touched.
#
# Measured on 2026-09-26, before any of this: 4 vCPU, 7894 MB of memory with
# 3100 MB available, 4095 MB of swap, 58 GB of disk with 25 GB free, load 0.00.
# An opencode job peaked at 663 MiB in its container, so two at a time is about
# 1.8 GB of the 3.1 GB that is free. That is where job_concurrency comes from.
job_concurrency: 2
serve_enabled: true
job_memory: 900m

# :8000, :8010, :8020, :8021, :8030 and :8081 are taken by the other apps.
backend_port: 8040

# The box's own MySQL and Redis, claimed the way every other app here claims
# them: one database, one user granted on `haas.*` and nothing else, and Redis
# db4 because db0 to db3 are in use. Neither service is installed or
# reconfigured by this playbook, and no other app's database, user or index is
# touched. db_password lives in greencloud.vault.yml.
store: mysql
db_name: haas
db_user: haas
redis_db: 4

# The model this box thinks with. An OpenAI-compatible endpoint with a bearer
# token, so the proxy adds the credential the same way it would for any other:
# the container is given a per-job token and never the key. The address is the
# root, because the container supplies the rest of the path.
# Measured on 2026-09-26: this endpoint serves 58 models, but only the
# open-weights ones are licensed here. It answers /v1/chat/completions and
# /v1/responses; the anthropic.* models it lists refuse both.
credentials:
  - name: platform
    address: "https://bedrock-mantle.us-east-1.api.aws"
    auth: bearer
    key_var: model_key
    # Measured on 2026-09-26: its responses API accepts only `function` and
    # `mcp` tools, and codex sends a `namespace` one. So it serves opencode
    # and nothing else here, and codex is not offered it.
    harnesses:
      - opencode
  # Measured on 2026-09-26: serves deepseek-flash and deepseek-v4-pro, and
  # implements the responses API, which is the only wire codex still speaks.
  - name: deepseek
    address: "https://api.deepseek.com"
    auth: bearer
    key_var: deepseek_key

models: "platform/qwen.qwen3-vl-235b-a22b-instruct,deepseek/deepseek-flash"

# ufw is active and default-deny, and already allows nginx. The service binds
# localhost, so there is no rule to add.

# Sign-in is Google, and one address. The app is in testing mode with that
# address as its only test user, so the provider refuses anybody else before
# this server is even asked.
oidc_issuer: "https://accounts.google.com"
oidc_allowed: "tosinamuda@gmail.com"

# Autodeploy stays off here until its key exists. To turn it on, put the public
# half of the key GitHub holds in autodeploy_public_key, set autodeploy_enabled,
# and run the playbook once by hand; README.md has the steps.
autodeploy_enabled: true
autodeploy_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIISdoI6zBtx+cnKvjxpnQ7zp35CLRg/AcjhsZz0NRC3k haas-deploy, asks greencloud to deploy a commit on main"
