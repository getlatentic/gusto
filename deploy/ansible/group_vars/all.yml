---
# ── Identity ────────────────────────────────────────────────────────────────
# haas runs as its own user rather than www-data, which is the convention for
# the other apps on a shared box. Rootless containers need a subuid range and a
# writable home for the image store, and www-data has neither. Giving them to a
# user that eight other services run as would change those services; a new user
# changes nothing.
app_user: haas
app_root: /opt/haas
manage_app_user: true
manage_default_site: false # never touch the default site or another app's vhost

# ── Code delivery (git only) ────────────────────────────────────────────────
# The box clones and pulls; nothing is copied up from a laptop. A private repo
# needs a read-only deploy key, which the common role generates and prints.
repo_url: git@github.com:getlatentic/gusto.git
repo_branch: main
# What the checkout lands on. A hand deploy takes the branch's head; a deploy
# the box runs itself names the exact commit that passed its tests.
repo_version: "{{ repo_branch }}"

# ── The toolchain ───────────────────────────────────────────────────────────
# Pinned, and under the app root. /usr/local/go on a shared box belongs to
# whoever put it there.
# 1.26.8 is the newest 1.26; every release before 1.26.6 carries standard-library
# fixes this server is reachable by (net/http, crypto/tls, html/template).
# go_sha256 is the tarball's checksum from go.dev/dl, checked before it is used.
go_version: "1.26.8"
go_sha256: "d0f743b33e8d8945e6b1f432edd15785c70507121d6e2a723b21285eddf8b57b"

# ── The sandbox ─────────────────────────────────────────────────────────────
# podman, because it runs no daemon: nothing is resident between jobs and no
# iptables rules are rewritten on a box whose nginx fronts other sites.
container_runtime: podman
runner_image: haas:dev
# Adapters of your own live here. The server offers what it finds, so a harness
# added to this directory appears in the pages without a new binary.
harnesses_dir: "{{ app_root }}/var/harnesses"
# Where nginx finds the page it answers with when the server is not answering.
haas_errors_dir: /var/www/haas-errors
# The harnesses the runner image carries, each as name=package: the adapter's
# name and the npm package that provides its program. The image lists them in
# its com.getlatentic.gusto.harnesses label, and the server offers a harness only
# when its program is really on the image's PATH.
#
# Each runs on the proxy's per-job token and nobody's account. codex, dsh and
# hermes are pinned to the versions their adapters were measured against,
# since a new release can move where a harness reads its model, its key or
# the session it resumes.
runner_harnesses:
  - opencode=opencode-ai
  - claude=@anthropic-ai/claude-code
  - codex=@openai/codex@0.154.0
  - pi=@earendil-works/pi-coding-agent
  - dsh=@deepseek-ai/dsh@0.1.5-rc.3
  - hermes=hermes-agent@0.21.5

# The npm packages of the MCP servers the image carries, for mcp_servers to
# offer, and of what a harness needs to call them. A setup can only give a
# harness a server whose program is here.
runner_mcp_packages:
  - "@modelcontextprotocol/server-memory@2026.8.31"
  # Not a server: the extension pi takes MCP servers through, measured on
  # 2026-09-27 against a probe server.
  - "pi-mcp-adapter@3.0.0"

# The MCP servers a setup may choose from, one file each in var/mcp. A server
# is a program the image carries, or an address a job may reach. What a
# definition holds reaches the box that runs it, so it holds no secret a job's
# agent should not read.
mcp_servers:
  - name: memory
    command: mcp-server-memory
    # The instance's own state, so what it remembers lasts across turns and
    # threads and belongs to that instance alone.
    env:
      MEMORY_FILE_PATH: /root/.local/share/mcp-memory.jsonl

# What one job may take. A limit larger than the machine is not a limit: the job
# takes what it likes and the kernel kills whatever it reaches first, which on a
# shared box is somebody else's service.
job_memory: 900m
job_cpus: "1"
job_concurrency: 2
# How many jobs one person, or one team, may run at once. A job over its limit
# waits and says why. Zero is no limit. docs/LIMITS.md.
limit_person: 0
limit_team: 0

# ── Proving the deploy ──────────────────────────────────────────────────────
# Every deploy runs one real job in a container and verifies its evidence. It
# costs a few seconds and it is the only thing that proves the runner works on
# this box rather than on a laptop.
smoke: true
# The file behind the smoke test's fixture agent. broken.json fails the check
# on purpose, to show a failing smoke task leaves the previous version running.
smoke_fixture: fixture.json

# ── Releases ────────────────────────────────────────────────────────────────
# A deploy builds a candidate binary and a candidate image beside the live ones
# and promotes them only after smoke passes. The version it replaces is kept as
# the previous one, which is what a failed start and rollback.yml go back to.
live_bin: "{{ app_root }}/bin/haas"
candidate_bin: "{{ app_root }}/bin/haas.next"
previous_bin: "{{ app_root }}/bin/haas.previous"
candidate_image: haas:candidate
previous_image: haas:previous
# How long a promoted server has to answer /healthz before the previous one
# comes back: health_retries tries, health_delay seconds apart. A ceiling, not
# a measured start time.
health_retries: 20
health_delay: 3

# ── The service, and the pages ──────────────────────────────────────────────
# Off until there is an HTTP server to run. Turning it on brings up the systemd
# unit, the vhost and the certificate.
serve_enabled: false
backend_port: 8040
server_name: haas.getlatentic.com
api_public_port: 443
enable_tls: true
certbot_email: tosinamuda@gmail.com
acme_webroot: /var/www/letsencrypt

# ── Autodeploy ──────────────────────────────────────────────────────────────
# Off until a key is set up for it. On, a merge to main that passes its tests
# asks this box, over ssh, to deploy that commit, and the box deploys itself
# with the playbook and the vault it holds. The key can ask for that and for
# nothing else. README.md has the setup, the trade, and how to turn it off.
autodeploy_enabled: false
autodeploy_public_key: ""
autodeploy_user: haas-deploy
autodeploy_home: /var/lib/haas-deploy
# Root's alone: the checkout the box deploys from, Ansible's virtualenv, the
# collections, the lock, and the commit last deployed.
autodeploy_root: /opt/haas-deploy
autodeploy_etc: /etc/haas-deploy
# pip picks the newest release in this range that the box's Python supports.
autodeploy_ansible: "ansible-core>=2.16,<2.20"
# Copied to the box from the laptop that enables autodeploy.
autodeploy_vault_file: "{{ playbook_dir }}/greencloud.vault.yml"
# This app's vault has a password of its own, not the one shared with the other
# apps on the box: autodeploy puts the password on the box, and a shared one
# would put every other app's secrets within reach of this app's deploy.
autodeploy_vault_password_file: ~/.config/haas/vault_pass.txt
# Set by the box when it deploys itself, and by nothing else.
autodeploy_self: false

# ── Who may sign in ─────────────────────────────────────────────────────────
# Without an issuer the shared password is the only way in, which is what a
# laptop has. With one, the provider settles who somebody is and oidc_allowed
# settles whether they may spend this server's credential: an address, or
# "@example.com" for any address at that domain.
#
# The redirect is derived from the vhost rather than written out, because a
# provider refuses an address that does not match the one registered with it,
# and two places to change a hostname is one place to forget.
oidc_issuer: ""
oidc_allowed: ""
haas_admins: ""
# With a company's own provider, its groups grant the roles and oidc_allowed can
# stay empty: a person in neither list is refused. oidc_groups_claim and
# oidc_scopes are for a provider that names groups elsewhere or wants a scope
# asked before it releases them (Okta: "groups").
oidc_runner_groups: ""
oidc_admin_groups: ""
oidc_groups_claim: ""
oidc_scopes: ""
oidc_redirect: "{{ 'https' if enable_tls else 'http' }}://{{ server_name }}/auth/callback"
# oidc_client_id and oidc_client_secret come from the vault.

# ── Where the state lives ───────────────────────────────────────────────────
# Two stores, because two deployments are real. "sqlite" keeps everything in one
# file under the app root, which is what a laptop wants and what a customer
# installing one artifact gets. "mysql" uses a box's existing MySQL and Redis:
# its own database and user, and a numbered Redis index for the queue and for
# fanning a job's output out to everybody watching it.
store: sqlite
sqlite_path: "{{ app_root }}/var/haas.db"

db_name: haas
db_user: haas
mysql_socket: /var/run/mysqld/mysqld.sock
# db_password comes from the vault, never from here.

# Redis carries the run queue and the live stream, so two processes can watch one
# job and see the same order. db0 to db3 are taken on greencloud.
redis_url: "redis://localhost:6379/{{ redis_db }}"
redis_db: 4
redis_claimed: false

# ── The way out of a sandbox ────────────────────────────────────────────────
# Setting model_upstream turns the proxy on: the container is given an address
# here instead of a credential, and model_key never leaves the server process.
# The address is the model's root, with no version on it.
model_upstream: ""
model_name: "the platform credential"
# What the pages offer to think with. Only the deployment knows which models the
# credential actually reaches, so a server that names none offers a free field.
models: ""
proxy_addr: "0.0.0.0:8041"

# ── The credentials a job may spend ─────────────────────────────────────────
# Each entry becomes var/credentials/<name>.json, read once at startup. The name
# is what a model names: a job asking for `platform/qwen…` is served by the
# credential called `platform`, and one asking for a name this deployment does
# not hold is refused before its container starts.
#
# The key never appears in the environment file. key_var names the vault
# variable that holds it, and the playbook writes it into the credential's own
# file, readable by the app user alone.
#
#   credentials:
#     - name: platform
#       address: "https://…"        # the model's root, with no version on it
#       auth: bearer                # bearer, or anthropic for its own header
#       key_var: model_key
credentials: []

# ── The model ───────────────────────────────────────────────────────────────
# Empty means the harness uses its own account. An address here is what the
# rules check and what a local-model harness is pointed at.
model_url: ""

# A GitHub App that reaches the repositories jobs name. Empty leaves a
# repository to be reached the way git reaches it on the box. The App's private
# key is github_app_private_key, from the vault. A GitHub Enterprise Server is
# github_url (https://ghe.example) and github_api (https://ghe.example/api/v3).
github_app_id: ""
github_url: ""
github_api: ""

# The name of this deployment's signing key, as the keyring files it and a
# verifier reads it. The key is made on the box the first time it deploys.
signer_name: "{{ inventory_hostname }}"

# The API takes scoped, revocable tokens an admin makes at /tokens, and not the
# shared password. Turning this on stops `haas submit` and deploy/smoke.sh
# working with the password: they need GUSTO_TOKEN. docs/TOKENS.md.
api_tokens: false

# How long finished work is kept, in days after a job ends, by the state it
# ended in (passed, failed, interrupted). A job loses its workspace first, then
# its signed record; nothing set is kept for ever. A record cannot go before its
# workspace. An empty policy removes nothing, and /retention still shows the disk
# and the holds. docs/RETENTION.md.
retention_policy: {}
#  workspaceDays: { passed: 14, failed: 30, interrupted: 7 }
#  recordDays: { passed: 365, failed: 365, interrupted: 90 }

# A release whose upgrade cannot be undone stops the deploy before it is
# promoted. Back the data up, then set this to let that one through. Turn it off
# again after: it is for one upgrade. docs/UPGRADE.md.
migrate_irreversible: false
