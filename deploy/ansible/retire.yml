---
# Retiring what has moved off this box.
#
# Deliberately not part of site.yml: a deploy should never delete anything, and
# this is run on purpose. It is idempotent and it checks before it removes.
#
#   ansible-playbook retire.yml
#
# What it does now: takes a dump of the closer database, stops and disables the
# three closer services, and removes the graspy checkout. What it leaves: the
# closer checkout, its vhost and its database, until somebody has watched for a
# few days. `remove_closer_files=true` finishes the job.
#
# Measured on 2026-09-26 before any of this, and the reason it is worth doing:
# closer held 212 MB of memory and 2.1 GB of disk, graspy 976 MB of disk, and in
# 48 hours the three closer services logged 34 requests between them — every one
# a 404 from a scanner or from a check run while writing this.
- name: Retire closer and graspy
  hosts: app
  become: true
  vars:
    closer_services:
      - closer-api
      - closer-ai
      - closer-worker
    closer_root: /opt/closer
    closer_database: closer
    graspy_root: /opt/graspy
    kept: /root/retired
    remove_closer_files: false

  tasks:
    - name: Somewhere to keep what is taken out
      ansible.builtin.file:
        path: "{{ kept }}"
        state: directory
        mode: "0700"

    # Before anything stops. A database is the one thing here that cannot be
    # rebuilt from a repository.
    - name: The closer database, dumped
      ansible.builtin.shell:
        cmd: "mysqldump --single-transaction --routines --events {{ closer_database }} > {{ kept }}/{{ closer_database }}.sql"
        creates: "{{ kept }}/{{ closer_database }}.sql"

    - name: The dump is not empty
      ansible.builtin.stat:
        path: "{{ kept }}/{{ closer_database }}.sql"
      register: dump
      failed_when: not dump.stat.exists or dump.stat.size < 1024

    - name: What is installed on this box
      ansible.builtin.service_facts:

    # Stopping is reversible, which is why it comes first and alone. The vhost
    # still proxies to the port these were listening on, so the hostname answers
    # 502 from here on rather than 404.
    - name: The closer services, stopped and disabled
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop: "{{ closer_services }}"
      when: (item + '.service') in ansible_facts.services

    # A unit without SuccessExitStatus=143 records the TERM that stopped it as a
    # failure. It is stopped and disabled either way, but leaving it there makes
    # `systemctl --failed` stop meaning anything on a box somebody else watches.
    - name: Which stopped units systemd thinks failed
      ansible.builtin.command:
        cmd: "systemctl is-failed {{ item }}"
      loop: "{{ closer_services }}"
      register: failing
      changed_when: false
      failed_when: false

    - name: Their failed state, cleared
      ansible.builtin.command:
        cmd: "systemctl reset-failed {{ item.item }}"
      loop: "{{ failing.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stdout | trim == "failed"

    # graspy is served from Cloudflare: graspy.getlatentic.com answers with
    # server: cloudflare from Cloudflare addresses. Nothing here routes to it,
    # so the checkout is the only thing left of it.
    - name: Nothing on this box still runs graspy
      ansible.builtin.assert:
        that:
          - ansible_facts.services | select('search', 'graspy') | list | length == 0
        fail_msg: "A graspy service exists on this box; look at it before deleting the checkout."

    - name: No vhost still names graspy
      ansible.builtin.command:
        cmd: grep -rl graspy /etc/nginx/sites-enabled/
      register: graspy_vhosts
      changed_when: false
      failed_when: false

    - name: A vhost naming graspy stops this
      ansible.builtin.assert:
        that:
          - graspy_vhosts.rc != 0
        fail_msg: "nginx still has a vhost naming graspy: {{ graspy_vhosts.stdout }}"

    - name: The graspy checkout, removed
      ansible.builtin.file:
        path: "{{ graspy_root }}"
        state: absent

    # The rest, once somebody has watched. Off by default on purpose.
    - name: The closer vhost, removed
      ansible.builtin.file:
        path: "/etc/nginx/sites-enabled/closer-api.conf"
        state: absent
      when: remove_closer_files | bool
      notify: Reload nginx

    - name: The closer checkout, removed
      ansible.builtin.file:
        path: "{{ closer_root }}"
        state: absent
      when: remove_closer_files | bool

    - name: The closer database, dropped
      ansible.mysql.mysql_db:
        name: "{{ closer_database }}"
        state: absent
        login_unix_socket: /var/run/mysqld/mysqld.sock
      when: remove_closer_files | bool

    - name: What the box has now
      ansible.builtin.shell:
        cmd: |
          free -m | awk '/Mem:/{print $2" MB total, "$7" MB available"}'
          df -h / | awk 'NR==2{print $4" disk free"}'
      register: after
      changed_when: false

    - name: The box, after
      ansible.builtin.debug:
        var: after.stdout_lines

  handlers:
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
