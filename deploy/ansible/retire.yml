---
# Takes gusto off this shared box. gusto runs as gusto cloud now, so nothing
# needs the server here, and every merge was spending the box's disk on a
# runner image nobody used.
#
#   ansible-playbook retire.yml
#
# It removes only what site.yml put here, and nothing another app on the box
# uses: no shared package, no other vhost, no other database. It is safe to run
# again. The server's data is kept as a tarball in /root/retired first, because
# the signed records in it cannot be rebuilt from the repository.
- name: Retire gusto from this box
  hosts: app
  become: true
  vars:
    app_user: gusto
    app_root: /opt/gusto
    deploy_user: gusto-deploy
    server_name: gusto.tosinamuda.com
    db_name: gusto
    db_user: gusto
    mysql_socket: /var/run/mysqld/mysqld.sock
    kept: /root/retired

  tasks:
    - name: Somewhere to keep what is taken out
      ansible.builtin.file:
        path: "{{ kept }}"
        state: directory
        mode: "0700"

    - name: Whether the server's data is still here
      ansible.builtin.stat:
        path: "{{ app_root }}/var"
      register: data

    # The key a merge used to ask for a deploy goes first, so nothing starts a
    # deploy while the rest is taken away.
    - name: No key may ask this box for a deploy, and no sudo rule runs one
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/gusto-deploy/.ssh/authorized_keys
        - /etc/sudoers.d/gusto-deploy

    - name: What is installed on this box
      ansible.builtin.service_facts:

    - name: The server, stopped and disabled
      ansible.builtin.systemd:
        name: gusto
        state: stopped
        enabled: false
      when: "'gusto.service' in ansible_facts.services"

    # Stopped first, so the tarball holds a data directory nothing is writing.
    - name: The server's data, kept
      ansible.builtin.command:
        cmd: "tar -czf {{ kept }}/gusto-var.tgz -C {{ app_root }} var"
        creates: "{{ kept }}/gusto-var.tgz"
      when: data.stat.exists

    - name: The kept data is there and not empty
      ansible.builtin.stat:
        path: "{{ kept }}/gusto-var.tgz"
      register: tarball
      failed_when: not tarball.stat.exists or tarball.stat.size < 1024

    # Gone with the vhost, so nginx is reloaded before anything it points at is.
    - name: The vhost
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/nginx/sites-enabled/gusto.conf
        - /etc/nginx/sites-available/gusto.conf
      register: vhost

    - name: nginx still reads its configuration
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false
      when: vhost is changed

    - name: nginx, reloaded without it
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
      when: vhost is changed

    - name: Whether the certificate is still here
      ansible.builtin.stat:
        path: "/etc/letsencrypt/renewal/{{ server_name }}.conf"
      register: certificate

    - name: The certificate, so certbot stops renewing a name that is gone
      ansible.builtin.command:
        cmd: "certbot delete --non-interactive --cert-name {{ server_name }}"
      when: certificate.stat.exists

    - name: Whether the app user is still here
      ansible.builtin.getent:
        database: passwd
        key: "{{ app_user }}"
        fail_key: false

    # The images are most of the disk, and only the app user's podman can
    # remove them: they are in its own store under its home.
    - name: The app user's containers and images
      ansible.builtin.command:
        cmd: podman system reset --force
        chdir: "{{ app_root }}"
      become_user: "{{ app_user }}"
      environment:
        HOME: "{{ app_root }}"
      when: ansible_facts.getent_passwd[app_user] is not none

    - name: The app user's session no longer lingers
      ansible.builtin.file:
        path: "/var/lib/systemd/linger/{{ app_user }}"
        state: absent

    - name: The app user's processes, ended
      ansible.builtin.command:
        cmd: "loginctl terminate-user {{ app_user }}"
      register: ended
      changed_when: ended.rc == 0
      failed_when: false

    - name: Whether the deploy's unit is still here
      ansible.builtin.stat:
        path: /etc/systemd/system/gusto-deploy@.service
      register: deploy_unit

    - name: The deploys that ran here, stopped and forgotten
      when: deploy_unit.stat.exists
      ansible.builtin.shell:
        cmd: >-
          systemctl stop 'gusto-deploy@*.service';
          systemctl reset-failed 'gusto-deploy@*.service' 'gusto.service' || true

    - name: The units, the deploy's commands and its directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/gusto.service
        - /etc/systemd/system/gusto-deploy@.service
        - /usr/local/sbin/gusto-deploy
        - /usr/local/sbin/gusto-deploy-run
        - /etc/gusto-deploy
        - /opt/gusto-deploy
        - /var/lib/gusto-deploy
        - /var/www/gusto-errors

    - name: systemd, without the units
      ansible.builtin.systemd:
        daemon_reload: true

    - name: The users
      ansible.builtin.user:
        name: "{{ item }}"
        state: absent
      loop:
        - "{{ app_user }}"
        - "{{ deploy_user }}"

    # site.yml made the change log append-only, and an append-only file cannot
    # be removed.
    - name: The change log, no longer append-only
      ansible.builtin.command:
        cmd: "chattr -a {{ app_root }}/var/changes/changes.jsonl"
      register: unlocked
      changed_when: unlocked.rc == 0
      failed_when: false

    # After the tarball, and after the user, whose home it is.
    - name: The app root
      ansible.builtin.file:
        path: "{{ app_root }}"
        state: absent

    - name: The app user's subuid and subgid range
      ansible.builtin.lineinfile:
        path: "{{ item }}"
        regexp: "^{{ app_user }}:"
        state: absent
      loop:
        - /etc/subuid
        - /etc/subgid

    # The database was made and never used: the server kept its state in files.
    # A database that holds a table is not dropped.
    - name: Whether the database is there, and its tables
      ansible.builtin.command:
        cmd: >-
          mysql --socket={{ mysql_socket }} -N -e
          "SELECT COUNT(*) FROM information_schema.schemata WHERE schema_name = '{{ db_name }}';
          SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = '{{ db_name }}'"
      register: tables
      changed_when: false

    - name: The database and its user, when it holds nothing
      ansible.builtin.command:
        cmd: >-
          mysql --socket={{ mysql_socket }} -e
          "DROP DATABASE IF EXISTS `{{ db_name }}`; DROP USER IF EXISTS '{{ db_user }}'@'localhost'"
      when: (tables.stdout_lines[0] | int) == 1 and (tables.stdout_lines[1] | int) == 0

    - name: The box's inventory note, without gusto
      ansible.builtin.blockinfile:
        path: /opt/INVENTORY.md
        marker: "<!-- {mark} gusto (managed by gusto/deploy/ansible) -->"
        state: absent
      failed_when: false
