{{- $password := not .Values.auth.existingSecret -}}
{{- $key := and .Values.model.key (not .Values.model.existingSecret) -}}
{{- if or $password $key }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "haas.fullname" . }}
  labels:
    {{- include "haas.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $password }}
  # The server refuses to start without a sign-in, and so does the chart.
  HAAS_PASSWORD: {{ required "set auth.password, or auth.existingSecret naming a Secret with HAAS_PASSWORD" .Values.auth.password | quote }}
  {{- end }}
  {{- if $key }}
  HAAS_MODEL_KEY: {{ .Values.model.key | quote }}
  {{- end }}
{{- end }}
