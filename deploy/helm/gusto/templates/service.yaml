apiVersion: v1
kind: Service
metadata:
  name: {{ include "gusto.fullname" . }}
  labels:
    {{- include "gusto.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "gusto.selector" . | nindent 4 }}
  ports:
    # The pages and the API. The proxy is not here: jobs reach it through a
    # socket inside the pod, and nothing outside the pod may.
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
