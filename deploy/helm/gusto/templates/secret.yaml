{{- $password := not .Values.auth.existingSecret -}}
{{- $key := and .Values.model.key (not .Values.model.existingSecret) -}}
{{- $oidc := and .Values.auth.oidc.clientSecret (not .Values.auth.oidc.existingSecret) -}}
{{- if or $password $key $oidc }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gusto.fullname" . }}
  labels:
    {{- include "gusto.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $password }}
  # The server refuses to start without a sign-in, and so does the chart.
  GUSTO_PASSWORD: {{ required "set auth.password, or auth.existingSecret naming a Secret with GUSTO_PASSWORD" .Values.auth.password | quote }}
  {{- end }}
  {{- if $key }}
  GUSTO_MODEL_KEY: {{ .Values.model.key | quote }}
  {{- end }}
  {{- if $oidc }}
  GUSTO_OIDC_CLIENT_SECRET: {{ .Values.auth.oidc.clientSecret | quote }}
  {{- end }}
{{- end }}
