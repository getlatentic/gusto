# Copy to greencloud.vault.yml, fill in, and encrypt with ansible-vault (deploy/greencloud/README.md). Every value is a secret
# or a setting of production that is kept out of the repository.
ansible_host: 203.0.113.10
gusto_public_ip: 203.0.113.10
# What /gusto/cloud-config holds on AWS.
gusto_cloud_config:
  cloud_domain: gusto.example.com
  cloud_zone: example.com
  cloud_mail: cloudflare://<account id>?from=gusto%40example.com
  cloud_apps_domain: apps.example.com
  cloud_apps_zone: example.com
  cloud_cert_email: ops@example.com
  cloud_free_mail: allow
  cloud_models: gemma/google.gemma-4-26b-a4b,gemma/google.gemma-4-31b
  cloud_turnstile_site: ""
  cloud_demo_minutes: 30
  cloud_book_url: ""
  cloud_demo_notify: ""
  cloud_demo_staff: example.com
# What Parameter Store holds on AWS, by the same names. Leave out what is not used: a host without the Stripe three bills nobody.
gusto_params:
  /gusto/cloudflare-dns-token: ""
  /gusto/cloudflare-mail-token: ""
  /gusto/model-key: ""
  /gusto/deepseek-key: ""
  /gusto/turnstile-secret: ""
  /gusto/lead-hook-url: ""
  /gusto/lead-hook-secret: ""
  /gusto/google-client-id: ""
  /gusto/google-secret: ""
