# Prometheus alert rules for haas. Each alert names its runbook entry in
# docs/RUNBOOK.md. Scrape /metrics with a token that may read metrics, under the
# job name "haas": deploy/alerts/prometheus.example.yml.
groups:
  - name: haas
    rules:
      - alert: HaasDown
        expr: up{job="haas"} == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "haas is not answering /metrics"
          runbook: "docs/RUNBOOK.md#haasdown"

      - alert: HaasNotReady
        expr: haas_runner_workers_alive < haas_runner_slots
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "haas has fewer workers running than it should"
          runbook: "docs/RUNBOOK.md#haasnotready"

      - alert: HaasQueueStuck
        expr: haas_queue_stuck_seconds > 300
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "A job nothing holds back has waited over five minutes and has not started"
          runbook: "docs/RUNBOOK.md#haasqueuestuck"

      - alert: HaasRunnersSaturated
        expr: haas_queue_depth > 0 and haas_jobs_running >= haas_runner_slots
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: "Every runner has been busy with jobs waiting for half an hour"
          runbook: "docs/RUNBOOK.md#haasrunnerssaturated"

      - alert: HaasJobsFailing
        expr: |
          sum(increase(haas_jobs_finished_total{state="failed"}[1h])) >= 5
          and
          sum(increase(haas_jobs_finished_total{state="failed"}[1h]))
            / sum(increase(haas_jobs_finished_total[1h])) > 0.5
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "More than half the jobs that ended in the last hour failed"
          runbook: "docs/RUNBOOK.md#haasjobsfailing"

      - alert: HaasDiskLow
        expr: haas_disk_free_bytes{store="jobs"} / haas_disk_total_bytes{store="jobs"} < 0.10
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "Less than 10% of the disk the jobs are kept on is free"
          runbook: "docs/RUNBOOK.md#haasdisklow"

      - alert: HaasModelErrors
        expr: |
          increase(haas_proxy_calls_total[10m]) >= 10
          and
          increase(haas_proxy_errors_total[10m]) / increase(haas_proxy_calls_total[10m]) > 0.2
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "More than a fifth of the model calls in the last ten minutes failed on the model's side"
          runbook: "docs/RUNBOOK.md#haasmodelerrors"

      - alert: HaasDeployFailed
        expr: haas_last_deploy_ok == 0
        for: 1m
        labels: { severity: page }
        annotations:
          summary: "The last deploy failed or was rolled back"
          runbook: "docs/RUNBOOK.md#haasdeployfailed"

      - alert: HaasRestartingOften
        expr: changes(haas_started_timestamp_seconds[30m]) >= 3
        labels: { severity: page }
        annotations:
          summary: "haas has restarted three times in half an hour"
          runbook: "docs/RUNBOOK.md#haasrestartingoften"
