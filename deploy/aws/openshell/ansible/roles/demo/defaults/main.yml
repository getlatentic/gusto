---
# The name organisations are served under, and the zone in Cloudflare it belongs to.
demo_region: us-east-1
demo_name: ""
demo_zone: ""
demo_bucket: ""
# cloudflare://<account id>?from=..., or smtp://..., or outbox.
demo_mail: ""
demo_cert_email: ""
demo_free_mail: allow
demo_image_key: ""
demo_models: platform/qwen.qwen3-vl-235b-a22b-instruct
demo_computer_memory: 3Gi
demo_computer_cpu: "2"
demo_dns_token_parameter: /haas/poc/cloudflare-dns-token
demo_mail_token_parameter: /haas/poc/cloudflare-mail-token
demo_model_parameter: /haas/poc/model-key
demo_deepseek_parameter: /haas/poc/deepseek-key
# How long a host has when it starts, and each extension adds, and the most a host may ever be up.
demo_lease_minutes: 30
demo_max_hours: 4
demo_user: ubuntu
demo_state: /var/lib/haas-cloud
demo_lib: /var/lib/haas
# all is one host that is the front door and runs the organisations' servers. orchestrator is the front door
# alone, and a cell is a host that runs servers for it; the orchestrator and every cell of one demo share
# demo_efs, the address of a shared file system, and the directory demo_run of it, where the organisations' data is.
demo_role: all
demo_efs: ""
demo_run: ""
demo_cell_secret_parameter: /haas/poc/cell-secret
demo_cell_gone_minutes: 5
demo_cell_port: 8060
# A visitor may start a demo, which lasts this many minutes from when it is ready, at /demo. Zero offers none.
demo_visitor_minutes: 0
demo_visitor_max: 5
demo_book_url: ""
