---
# The name organizations are served under, and the zone in Cloudflare it belongs to.
demo_region: us-east-1
demo_name: ""
demo_zone: ""
demo_bucket: ""
# cloudflare://<account id>?from=..., or smtp://..., or outbox.
demo_mail: ""
demo_cert_email: ""
demo_free_mail: allow
demo_image_key: ""
# Every model is offered to every engine, and the person chooses: gusto does not decide which pairs may be tried. A new chat starts on
# demo_chat_default, a pair measured to finish (docs/MATRIX.md), as engine=model. Claude Code reaches DeepSeek Flash through the
# anthropic credential.
demo_models: gemma/google.gemma-4-26b-a4b,gemma/google.gemma-4-31b,anthropic/deepseek-flash,deepseek/deepseek-flash
demo_chat_default: claude=gemma/google.gemma-4-26b-a4b
demo_computer_memory: 3Gi
demo_computer_cpu: "2"
demo_dns_token_parameter: /gusto/poc/cloudflare-dns-token
demo_mail_token_parameter: /gusto/poc/cloudflare-mail-token
demo_model_parameter: /gusto/poc/model-key
demo_deepseek_parameter: /gusto/poc/deepseek-key
# How long a host has when it starts, and each extension adds, and the most a host may ever be up.
demo_lease_minutes: 30
demo_max_hours: 4
demo_user: ubuntu
demo_state: /var/lib/gusto-cloud
demo_lib: /var/lib/gusto
# all is one host that is the front door and runs the organizations' servers. orchestrator is the front door
# alone, and a cell is a host that runs servers for it; the orchestrator and every cell of one demo share
# demo_efs, the address of a shared file system, and the directory demo_run of it, where the organizations' data is.
demo_role: all
demo_efs: ""
demo_run: ""
demo_cell_secret_parameter: /gusto/poc/cell-secret
demo_cell_gone_minutes: 5
demo_cell_port: 8060
# A visitor may start a demo, which lasts this many minutes from when it is ready, at /demo. Zero offers none.
# The front door that stays up: no lease, what is on the file system kept, and hosts for cells started when
# organizations need one, from the launch template demo_cell_template, tagged demo_project.
demo_live: false
demo_release: ""
demo_bundle_dir: /opt/gusto-bundle
# The start-up script a cell is made from, where the front door can read it: the bundle is root's.
demo_cell_userdata: /usr/local/lib/gusto/user-data.sh
demo_cell_template: gusto-poc-demo-host-cell-live
demo_cell_max: 3
demo_cell_idle_minutes: 10
# The most cells a day started for visitors who began the demo form, before they sent it.
demo_cell_prewarms: 20
# How many cells are stopped when idle, and started again when one is needed, rather than removed: a stopped cell costs its root
# disk, about 3.20 dollars a month, and starts in about 11 seconds where a new one takes about 17.
demo_cell_keep: 1
demo_cell_max_hours: 12
demo_project: gusto-live
demo_visitor_minutes: 0
# The public key of the bot check on the demo form, and where its secret is kept. Without the key there is no check.
demo_turnstile_site: ""
demo_turnstile_parameter: /gusto/poc/turnstile-secret
demo_lead_hook_url_parameter: /gusto/poc/lead-hook-url
demo_lead_hook_secret_parameter: /gusto/poc/lead-hook-secret
demo_visitor_max: 5
demo_book_url: ""
# An https address of a video file, or of a page that may be embedded, which the landing page shows.
demo_video_url: ""
# Mailed when a visitor starts a demo. Nothing is sent when it is empty.
demo_notify: ""

# Where the files of a host are written: the host's own root, or a directory a cell's kit is made from.
demo_root: ""
# The SHA-256 of the kit a front door makes for its cells, and the key of the image it is made for. A cell from that image
# configures itself from the kit; without one it runs the playbook.
demo_cell_kit: ""
demo_cell_kit_file: /usr/local/lib/gusto/cell-kit.tgz
demo_bake_key: ""
demo_cell_lease_minutes: 30

# Whether this host is made to have an image taken of it, and so is not started as a cell.
demo_bake: false

# Whether this host was made from the image of a cell that has what the release installs, so that it is not installed again.
demo_baked: false
