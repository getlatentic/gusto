---
- name: The host's start-up work runs now, which gets the certificate or the image and points the name here
  ansible.builtin.systemd:
    name: gusto-boot
    state: restarted
    enabled: true
    daemon_reload: true

- name: The lease is watched
  ansible.builtin.systemd:
    name: gusto-lease.timer
    state: started
    enabled: true
    daemon_reload: true
  when: not demo_live | bool

- name: The web server and gusto cloud are running
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: [nginx, gusto-cloud, gusto-owner]
  when: demo_role != 'cell'

# nginx starts when it is installed, with its default site, and a play that fails drops
# the reloads it had queued, so the site is loaded here every time, once its certificate is there.
- name: The web server loads the site
  ansible.builtin.systemd:
    name: nginx
    state: reloaded
  when: demo_role != 'cell'

# A host an image is made from is not started as a cell, which would register it and give it organizations.
- name: The host is running
  ansible.builtin.systemd:
    name: gusto-cell
    state: started
    enabled: true
  when: demo_role == 'cell' and not (demo_bake | bool)

- name: The name resolves from here, and the web server answers for it with a certificate that holds
  ansible.builtin.uri:
    url: "https://{{ demo_name }}/healthz"
  delegate_to: localhost
  become: false
  when: demo_role != 'cell' and (demo_check_public | default(true) | bool)
  register: answered
  until: answered.status == 200
  retries: 30
  delay: 10
