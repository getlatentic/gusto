---
# The organizations' data is on a file system every host of a demo mounts, in a directory of its own for the
# demo, at the path a single host keeps it: the front door and a cell both write and read it by that path.
- name: The tool that mounts the file system
  ansible.builtin.apt:
    name: nfs-common
    state: present
    update_cache: true
  when: not (demo_baked | bool)

- name: Where the file system and the demo's directory of it are mounted
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: ["/mnt/efs", "{{ demo_state }}"]

# A cell mounts the file system on every start, from its start-up script, and never from fstab: a host whose fstab names it orders
# it before the network, systemd breaks the cycle by deleting the network jobs, and the host comes up in emergency mode with no
# network, which a kept cell started again did. So on a cell the mounts below are made and not written down, and what an earlier
# run wrote is taken out.
- name: A cell's fstab does not name the shared file system
  ansible.posix.mount:
    path: "{{ item }}"
    state: absent_from_fstab
  loop: ["{{ demo_state }}", /mnt/efs]
  when: demo_role == 'cell'

# A mount target answers a little after it is made, and the name of the file system resolves after it does.
- name: The file system
  ansible.posix.mount:
    path: /mnt/efs
    src: "{{ demo_efs }}:/"
    fstype: nfs4
    opts: nfsvers=4.1,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2,noresvport,_netdev
    state: "{{ 'ephemeral' if demo_role == 'cell' else 'mounted' }}"
  register: mounted
  until: mounted is succeeded
  retries: 30
  delay: 10

- name: The demo's directory of it
  ansible.builtin.file:
    path: "/mnt/efs/runs/{{ demo_run }}"
    state: directory
    owner: "{{ demo_user }}"
    group: "{{ demo_user }}"
    mode: "0755"

# What an earlier demo left is not carried into this one: its organizations' computers went with its hosts.
- name: The directories of earlier demos are removed
  ansible.builtin.command: find /mnt/efs/runs -mindepth 1 -maxdepth 1 -not -name "{{ demo_run }}" -exec rm -rf {} +
  changed_when: false
  when: demo_role == 'orchestrator' and not demo_live | bool

- name: The demo's directory is where the organizations' data is
  ansible.posix.mount:
    path: "{{ demo_state }}"
    src: "/mnt/efs/runs/{{ demo_run }}"
    fstype: none
    opts: bind,x-systemd.requires-mounts-for=/mnt/efs
    state: "{{ 'ephemeral' if demo_role == 'cell' else 'mounted' }}"
