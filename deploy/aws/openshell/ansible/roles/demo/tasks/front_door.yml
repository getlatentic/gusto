---
- name: The web server, and the tool that gets a certificate from Let's Encrypt with a DNS record
  ansible.builtin.apt:
    name: [nginx, certbot, python3-certbot-dns-cloudflare]
    state: present
    update_cache: true

- name: The program that points the name at this host
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../.state/gusto-dns"
    dest: /usr/local/bin/gusto-dns
    mode: "0755"

- name: gusto cloud's settings, and what every organization's server is started with
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: org.env.j2, dest: /etc/gusto/org.env }
    - { src: cloud.env.j2, dest: /etc/gusto/cloud.env }
  notify: Restart the front door

- name: gusto cloud's service
  ansible.builtin.template:
    src: gusto-cloud.service.j2
    dest: /etc/systemd/system/gusto-cloud.service
    mode: "0644"
  notify: Restart the front door

- name: The operator's page, which listens on this host's loopback and is not in the web server's site
  ansible.builtin.template:
    src: gusto-owner.service.j2
    dest: /etc/systemd/system/gusto-owner.service
    mode: "0644"
  notify: Restart the owner's page

- name: The web server's site
  ansible.builtin.template:
    src: nginx-site.conf.j2
    dest: /etc/nginx/sites-available/gusto
    mode: "0644"
  notify: Reload nginx

- name: The site is on, and the default one is off
  ansible.builtin.file:
    src: "{{ item.src | default(omit) }}"
    dest: "{{ item.dest }}"
    state: "{{ item.state }}"
  loop:
    - { src: /etc/nginx/sites-available/gusto, dest: /etc/nginx/sites-enabled/gusto, state: link }
    - { dest: /etc/nginx/sites-enabled/default, state: absent }
  notify: Reload nginx

# Cells read the kit from the shared file system, and take it only when its sum is the one this host starts them with.
- name: Where the kits are
  ansible.builtin.file:
    path: "{{ demo_state }}/kits"
    state: directory
    mode: "0755"
  when: demo_cell_kit != ''

- name: The kit a cell configures itself from, where cells can read it
  ansible.builtin.copy:
    src: "{{ demo_cell_kit_file }}"
    dest: "{{ demo_state }}/kits/{{ demo_cell_kit }}.tgz"
    remote_src: true
    mode: "0644"
  when: demo_cell_kit != ''

# A cell started with an earlier kit that is gone runs the playbook, which is slower and right.
- name: The kits of earlier releases are removed
  ansible.builtin.command: find "{{ demo_state }}/kits" -name '*.tgz' -not -name "{{ demo_cell_kit }}.tgz" -delete
  changed_when: false
  when: demo_cell_kit != ''

- name: The script a host is started with, where gusto cloud may read it
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../user-data.sh"
    dest: "{{ demo_cell_userdata }}"
    mode: "0644"
  when: demo_live | bool
  notify: Restart the front door
