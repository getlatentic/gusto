---
- name: Docker, which an organization's agents run in when they run in containers
  ansible.builtin.apt:
    name: docker.io
    state: present
  when: demo_sandbox == 'container' and demo_root == ''

- name: Docker is running and starts with the host
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  when: demo_sandbox == 'container' and demo_root == ''

- name: The script that builds the model credentials from Parameter Store
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../e2e/credentials.sh"
    dest: "{{ demo_root }}/usr/local/lib/gusto/credentials.sh"
    mode: "0755"

- name: What the agent of a host is started with, and what the servers it starts are
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ demo_root }}/etc/gusto/{{ item }}"
    mode: "0644"
  loop: [cell.env, org.env]
  when: demo_role == 'cell'
  notify: Restart the cell

- name: The host's service
  ansible.builtin.template:
    src: gusto-cell.service.j2
    dest: "{{ demo_root }}/etc/systemd/system/gusto-cell.service"
    mode: "0644"
  when: demo_role == 'cell'
  notify: Restart the cell

# The image of a cell has cloud-init turned off when it is taken, and these start it in its place.
- name: What runs a cell's start-up script without cloud-init, and the network it is given
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ demo_root }}{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: gusto-launch, dest: /usr/local/sbin/gusto-launch, mode: "0755" }
    - { src: gusto-launch.service, dest: /etc/systemd/system/gusto-launch.service, mode: "0644" }
    - { src: netplan-cell.yaml, dest: /usr/local/lib/gusto/netplan-cell.yaml, mode: "0600" }
  when: demo_role == 'cell'

- name: The start-up script runs on every start
  ansible.builtin.systemd:
    name: gusto-launch
    enabled: true
    daemon_reload: true
  when: demo_role == 'cell' and demo_root == ''
