---
- name: What must be said for a host of this role
  ansible.builtin.assert:
    that:
      - demo_role in ['all', 'orchestrator', 'cell']
      - demo_bucket | length > 0
      - demo_image_key | length > 0
      - demo_role == 'cell' or (demo_name | length > 0 and demo_zone | length > 0 and demo_mail | length > 0 and demo_cert_email | length > 0)
      - demo_role == 'all' or (demo_efs | length > 0 and demo_run | length > 0)
    fail_msg: >-
      a host needs demo_role (all, orchestrator or cell), demo_bucket and demo_image_key; a front door also
      demo_name, demo_zone, demo_mail and demo_cert_email; an orchestrator or a cell also demo_efs and demo_run

- name: The shared file system
  ansible.builtin.import_tasks: shared_files.yml
  when: demo_role != 'all'

- name: Directories, programs and the start-up script
  ansible.builtin.import_tasks: common.yml

- name: The web server and gusto cloud
  ansible.builtin.import_tasks: front_door.yml
  when: demo_role != 'cell'

- name: The runner image and the agent
  ansible.builtin.import_tasks: cell.yml
  when: demo_role != 'orchestrator'

- name: Start it
  ansible.builtin.import_tasks: start.yml
