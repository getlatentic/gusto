---
- name: Restart the front door
  ansible.builtin.systemd:
    name: gusto-cloud
    state: restarted
    daemon_reload: true

- name: Restart the owner's page
  ansible.builtin.systemd:
    name: gusto-owner
    state: restarted
    daemon_reload: true

- name: Reload nginx
  ansible.builtin.systemd:
    name: nginx
    state: reloaded

- name: Restart the cell
  ansible.builtin.systemd:
    name: gusto-cell
    state: restarted
    daemon_reload: true
  when: not (demo_bake | bool) and demo_root == ''
