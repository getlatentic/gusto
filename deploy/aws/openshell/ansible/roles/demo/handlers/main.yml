---
- name: Restart the front door
  ansible.builtin.systemd:
    name: haas-cloud
    state: restarted
    daemon_reload: true

- name: Restart the owner's page
  ansible.builtin.systemd:
    name: haas-owner
    state: restarted
    daemon_reload: true

- name: Reload nginx
  ansible.builtin.systemd:
    name: nginx
    state: reloaded

- name: Restart the cell
  ansible.builtin.systemd:
    name: haas-cell
    state: restarted
    daemon_reload: true
  when: not (demo_bake | bool)
