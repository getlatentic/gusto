---
- name: Restart the front door
  ansible.builtin.systemd:
    name: "{{ cloud_name }}-cloud"
    state: restarted
    daemon_reload: true

- name: Restart the operator's page
  ansible.builtin.systemd:
    name: "{{ cloud_name }}-owner"
    state: restarted
    daemon_reload: true

- name: Reload nginx
  ansible.builtin.systemd:
    name: nginx
    state: reloaded

- name: Restart the cell
  ansible.builtin.systemd:
    name: "{{ cloud_name }}-cell"
    state: restarted
    daemon_reload: true
  when: not (cloud_bake | bool) and cloud_root == ''
