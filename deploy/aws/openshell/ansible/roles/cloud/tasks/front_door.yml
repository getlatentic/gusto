---
- name: The web server, and the tool that gets a certificate from Let's Encrypt with a DNS record
  ansible.builtin.apt:
    name: [nginx, certbot, python3-certbot-dns-cloudflare]
    state: present
    update_cache: true

- name: The program that points the name at this host
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../.state/gusto-dns"
    dest: "{{ cloud_bin }}/gusto-dns"
    mode: "0755"

- name: gusto cloud's settings, and what every organization's server is started with
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: org.env.j2, dest: "{{ cloud_etc }}/org.env" }
    - { src: org-demo.env.j2, dest: "{{ cloud_etc }}/org-demo.env" }
    - { src: cloud.env.j2, dest: "{{ cloud_etc }}/cloud.env" }
  notify: Restart the front door

- name: gusto cloud's service
  ansible.builtin.template:
    src: gusto-cloud.service.j2
    dest: "/etc/systemd/system/{{ cloud_name }}-cloud.service"
    mode: "0644"
  notify: Restart the front door

# gusto cloud runs as a user that may not remove what an agent's container left as root, and moves such a directory to its trash.
- name: The job that empties gusto cloud's trash, as root
  ansible.builtin.template:
    src: "gusto-{{ item }}.j2"
    dest: "/etc/systemd/system/{{ cloud_name }}-{{ item }}"
    mode: "0644"
  loop: [trash.service, trash.timer]

- name: The operator's page, which listens on this host's loopback and is not in the web server's site
  ansible.builtin.template:
    src: gusto-owner.service.j2
    dest: "/etc/systemd/system/{{ cloud_name }}-owner.service"
    mode: "0644"
  notify: Restart the operator's page

- name: Where the front door's media are
  ansible.builtin.file:
    path: "{{ cloud_media }}"
    state: directory
    mode: "0755"

- name: The front door's media, as the bucket holds them
  ansible.builtin.command: aws s3 sync s3://{{ cloud_bucket }}/media/ {{ cloud_media }}/ --delete --only-show-errors
  environment:
    AWS_REGION: "{{ cloud_region }}"
    AWS_DEFAULT_REGION: "{{ cloud_region }}"
    PATH: "/usr/local/bin:/snap/bin:/usr/bin:/bin"
  changed_when: false
  # A host with no bucket keeps the media it was given.
  when: cloud_bucket != ''

- name: The web server's site
  ansible.builtin.template:
    src: nginx-site.conf.j2
    dest: "/etc/nginx/sites-available/{{ cloud_name }}"
    mode: "0644"
  notify: Reload nginx

- name: The site is on, and the default one is off on a host that is gusto's alone
  ansible.builtin.file:
    src: "{{ item.src | default(omit) }}"
    dest: "{{ item.dest }}"
    state: "{{ item.state }}"
  loop: "{{ [{'src': '/etc/nginx/sites-available/' + cloud_name, 'dest': '/etc/nginx/sites-enabled/' + cloud_name, 'state': 'link'}]
    + ([{'dest': '/etc/nginx/sites-enabled/default', 'state': 'absent'}] if cloud_default_server | bool else []) }}"
  notify: Reload nginx

# Cells read the kit from the shared file system, and take it only when its sum is the one this host starts them with.
- name: Where the kits are
  ansible.builtin.file:
    path: "{{ cloud_state }}/kits"
    state: directory
    mode: "0755"
  when: cloud_cell_kit != ''

- name: The kit a cell configures itself from, where cells can read it
  ansible.builtin.copy:
    src: "{{ cloud_cell_kit_file }}"
    dest: "{{ cloud_state }}/kits/{{ cloud_cell_kit }}.tgz"
    remote_src: true
    mode: "0644"
  when: cloud_cell_kit != ''

# A cell started with an earlier kit that is gone runs the playbook, which is slower and right.
- name: The kits of earlier releases are removed
  ansible.builtin.command: find "{{ cloud_state }}/kits" -name '*.tgz' -not -name "{{ cloud_cell_kit }}.tgz" -delete
  changed_when: false
  when: cloud_cell_kit != ''

- name: The script a host is started with, where gusto cloud may read it
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../user-data.sh"
    dest: "{{ cloud_cell_userdata }}"
    mode: "0644"
  when: cloud_live | bool
  notify: Restart the front door
