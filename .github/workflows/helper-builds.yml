# The helper on a person's computer has to build for every system a person has. The server's own program does not build for
# Windows, so this builds the helper's, for each of them, whenever it or what it uses changes.
name: helper-builds

on:
  pull_request:
    paths:
      - cmd/haas-helper/**
      - internal/helper/**
      - go.mod
      - go.sum
      - .github/workflows/helper-builds.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        target: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build, with no C compiler
        env:
          CGO_ENABLED: "0"
        run: |
          target="${{ matrix.target }}"
          GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./cmd/haas-helper
      - name: Test the helper
        if: matrix.target == 'linux/amd64'
        run: go test ./internal/helper/...
