# A merge to main deploys itself, once its tests pass.
#
# This workflow does not hold the playbook's secrets and does not run the
# playbook. It asks the box, over ssh, to deploy the commit that passed, and
# the box does the deploy with the playbook and vault it already holds. The key
# in DEPLOY_SSH_KEY can do that and nothing else: deploy/ansible/README.md says
# what the key can reach, how to set it up, and how to turn this off.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. A merge that lands while one runs waits for it rather
# than canceling it; when several wait, only the newest runs, and it carries
# everything the others would have.
concurrency:
  group: deploy-greencloud
  cancel-in-progress: false

jobs:
  test:
    runs-on: [self-hosted, gusto]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The macOS helper and its tests link the system's own libraries through cgo. A C compiler that is not Apple's, such as
      # Homebrew's, cannot read the SDK's current text stubs, so the link fails.
      - name: Use the platform's C compiler
        if: runner.os == 'macOS'
        run: echo "CC=/usr/bin/clang" >> "$GITHUB_ENV"
      - name: Formatted
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...

  deploy:
    needs: test
    # Off until the repository variable AUTODEPLOY is "on", so the workflow can
    # be merged before the box and the secrets are ready, and turned off
    # without a commit.
    if: github.ref == 'refs/heads/main' && vars.AUTODEPLOY == 'on'
    runs-on: [self-hosted, gusto]
    timeout-minutes: 60
    # Secrets kept on this environment, restricted to main, are out of reach of
    # a workflow run from any other branch.
    environment: greencloud
    steps:
      # No checkout: nothing from the repository runs on the runner that holds
      # the key. The box fetches the commit itself and checks it is on main.
      - name: Ask the box to deploy this commit
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          for name in DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_HOST; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::The secret $name is not set. deploy/ansible/README.md says what it holds."
              exit 1
            fi
          done
          umask 077
          # The runner is a person's machine, so the key is kept in the job's own directory and removed after.
          keys="$(mktemp -d "$RUNNER_TEMP/deploy.XXXXXX")"
          trap 'rm -rf "$keys"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$keys/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$keys/deploy_known_hosts"
          # The host key is pinned by the secret, never accepted on first sight.
          ssh -i "$keys/deploy_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$keys/deploy_known_hosts" \
            -o ServerAliveInterval=30 \
            "gusto-deploy@$DEPLOY_HOST" "$GITHUB_SHA"
