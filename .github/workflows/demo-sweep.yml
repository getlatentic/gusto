# The backstop for a host whose own timer did not remove it: anything tagged for the project that has
# been up more than six hours is terminated.
name: demo sweep

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.HAAS_AWS_ROLE }}
          aws-region: us-east-1
      - run: deploy/aws/openshell/demo-sweep.sh
