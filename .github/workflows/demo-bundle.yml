# A merge to main that changes what a demo host is made from puts a release bundle in the store
# bucket, and the runner image too when the image itself changed. A host configures itself from the
# newest bundle, so nothing is built or copied from anybody's machine. The AWS role can put objects
# in the bucket and launch and remove hosts tagged for the project, and nothing else.
name: demo bundle

on:
  push:
    branches: [main]
    paths:
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
      - Dockerfile
      - image/**
      - deploy/aws/openshell/**
      - deploy/aws/platform/user-data.sh
      - .github/workflows/demo-bundle.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: demo-bundle
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  bundle:
    runs-on: [self-hosted, gusto]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.GUSTO_AWS_ROLE }}
          aws-region: us-east-1
      - name: The runner image, when it is not in the bucket
        env:
          BUCKET: ${{ vars.GUSTO_BUCKET }}
        run: |
          key="$(deploy/aws/openshell/image-key.sh)"
          if aws s3api head-object --bucket "$BUCKET" --key "image/$key.tar.gz" >/dev/null 2>&1; then
            echo "the image $key is in the bucket"
            exit 0
          fi
          if [ "$(uname -m)" != x86_64 ]; then
            echo "::error::the image $key is not in the bucket, and this runner is $(uname -m), which cannot build it. Run deploy/aws/openshell/publish-image.sh, which builds it on an x86 host, and run this again."
            exit 1
          fi
          docker build --platform linux/amd64 --build-arg "HARNESSES=$(deploy/aws/openshell/harnesses.sh)" -t gusto-runner .
          container="$(docker create gusto-runner true)"
          docker export "$container" | gzip -1 > image.tar.gz
          aws s3 cp image.tar.gz "s3://$BUCKET/image/$key.tar.gz" --only-show-errors
          echo "made the image $key: $(du -h image.tar.gz | cut -f1)"
      - name: The bundle
        env:
          BUCKET: ${{ vars.GUSTO_BUCKET }}
        run: |
          deploy/aws/openshell/bundle.sh out
          prefix="s3://$BUCKET/releases/$GITHUB_SHA"
          aws s3 cp out/bundle.tgz "$prefix/bundle.tgz" --only-show-errors
          aws s3 cp out/bundle.tgz.sha256 "$prefix/bundle.tgz.sha256" --only-show-errors
          printf '%s' "$GITHUB_SHA" | aws s3 cp - "s3://$BUCKET/releases/latest" --only-show-errors
          echo "release $GITHUB_SHA is the latest"
      - name: gusto cloud, which stays up, brought to this release
        run: |
          id="$(aws ec2 describe-instances --filters Name=tag:project,Values=haas-live Name=tag:name,Values=front-door Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)"
          if [ -z "$id" ] || [ "$id" = None ]; then echo "no gusto cloud is up, so there is nothing to upgrade"; exit 0; fi
          # What the host was started with is kept in /etc/haas/live.env. The script of the release it is being brought to is
          # the one that runs, so a change to how a host is made takes effect in the upgrade that brings it. A command sent
          # over SSM has no home directory, which the AWS command needs.
          command="export HOME=/root; set -a; . /etc/haas/live.env; set +a; export PATH=\$PATH:/snap/bin; aws s3 cp s3://\$BUCKET/releases/$GITHUB_SHA/bundle.tgz /tmp/next.tgz --only-show-errors; tar -xzf /tmp/next.tgz -O ./user-data.sh > /tmp/next-user-data.sh; RELEASE=$GITHUB_SHA bash /tmp/next-user-data.sh"
          run="$(aws ssm send-command --document-name AWS-RunShellScript --instance-ids "$id" \
            --parameters "commands=[\"$command\"]" --query Command.CommandId --output text)"
          for _ in $(seq 1 60); do
            state="$(aws ssm get-command-invocation --command-id "$run" --instance-id "$id" --query Status --output text 2>/dev/null || echo Pending)"
            case "$state" in
              Success) echo "gusto cloud $id is at $GITHUB_SHA"; exit 0;;
              Failed|Cancelled|TimedOut) echo "the upgrade of $id ended as $state"; aws ssm get-command-invocation --command-id "$run" --instance-id "$id" --query StandardErrorContent --output text | tail -20; exit 1;;
            esac
            sleep 15
          done
          echo "the upgrade of $id did not finish in 15 minutes"; exit 1
