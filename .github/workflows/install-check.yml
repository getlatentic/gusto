# Installs haas the way a customer does: from the digests a release names, with
# no build, after checking each image's signature. Each install then runs a job
# and verifies its signed record. It runs by hand against any
# release tag, and when this file or the compose install changes on an issue
# branch. The images are private, so the workflow's own token is what reads them.
name: install-check

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to install
        default: v0.1.0-rc.1
  push:
    branches: ["issue-307-*"]
    paths:
      - .github/workflows/install-check.yml
      - deploy/compose/**

permissions:
  contents: read
  packages: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag || 'v0.1.0-rc.1' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The digests the release names
        id: digests
        run: |
          notes="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          server="$(sed -n 's/^HAAS_SERVER_IMAGE=//p' <<<"$notes")"
          runner="$(sed -n 's/^HAAS_RUNNER_IMAGE=//p' <<<"$notes")"
          case "$server$runner" in *@sha256:*@sha256:*) ;; *) echo "the release $TAG names no digests"; exit 1 ;; esac
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify each signature before pulling
        env:
          SERVER: ${{ steps.digests.outputs.server }}
          RUNNER: ${{ steps.digests.outputs.runner }}
        run: |
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$TAG"
          for image in "$SERVER" "$RUNNER"; do
            cosign verify "$image" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
            echo "signature holds: $image"
          done

      - name: Install with no build
        working-directory: deploy/compose
        env:
          SERVER: ${{ steps.digests.outputs.server }}
          RUNNER: ${{ steps.digests.outputs.runner }}
        run: |
          {
            echo "HAAS_PASSWORD=install-check"
            echo "HAAS_DATA=$RUNNER_TEMP/haas"
            echo "HAAS_SERVER_IMAGE=$SERVER"
            echo "HAAS_RUNNER_IMAGE=$RUNNER"
            echo "HAAS_CREDENTIALS=$RUNNER_TEMP/haas/credentials"
            echo "HAAS_MODELS=stub/stub-model"
            echo "HAAS_SPEND_POLICY=$RUNNER_TEMP/haas/spend.json"
            echo "HAAS_OIDC_ISSUER=http://dex:5556/dex"
            echo "HAAS_OIDC_CLIENT_ID=haas"
            echo "HAAS_OIDC_CLIENT_SECRET=haas-secret"
            echo "HAAS_OIDC_REDIRECT=http://127.0.0.1:8040/auth/callback"
            echo "HAAS_OIDC_SCOPES=groups"
            echo "HAAS_ADMIN_GROUPS=authors"
          } > .env
          mkdir -p "$RUNNER_TEMP/haas/credentials"
          echo '{"name":"stub","address":"http://stub:9000","key":"not-a-key"}' > "$RUNNER_TEMP/haas/credentials/stub.json"
          echo '{"prices":{"stub-model":{"inputPerMillion":1000,"outputPerMillion":10000}}}' > "$RUNNER_TEMP/haas/spend.json"
          docker compose pull
          docker compose create --no-build
          docker run -d --name dex --network haas_default -p 127.0.0.1:5556:5556 \
            -v "$GITHUB_WORKSPACE/deploy/ssocheck/dex.yaml:/etc/dex/config.docker.yaml:ro" ghcr.io/dexidp/dex:v2.42.0@sha256:1b4a6eee8550240b0faedad04d984ca939513650e1d9bd423502c67355e3822f
          docker compose up -d --no-build
          docker run -d --name stub --network haas_default -v "$GITHUB_WORKSPACE/deploy/stubmodel/stub.py:/stub.py:ro" python:3.13-alpine python -u /stub.py
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8040/healthz > /dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8040/healthz

      - name: What is running is what the release named
        working-directory: deploy/compose
        env:
          SERVER: ${{ steps.digests.outputs.server }}
        run: |
          running="$(docker inspect --format '{{.Config.Image}}' "$(docker compose ps -q server)")"
          test "$running" = "$SERVER" || { echo "the server runs $running, and the release named $SERVER"; exit 1; }
          echo "the server runs $running"

      - name: Sign in and reach the pages
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' -c jar --data-urlencode password=install-check http://127.0.0.1:8040/login)"
          test "$code" = 303 || { echo "signing in answered $code"; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' -b jar http://127.0.0.1:8040/)"
          test "$code" = 200 || { echo "the home page answered $code"; exit 1; }
          echo "signed in, and the home page answered $code"

      - name: Run a job that asks a model, and check what the proxy counted
        working-directory: deploy/compose
        run: docker compose exec -T server sh < ../smoke-model.sh

      - name: Run a job and verify its record
        working-directory: deploy/compose
        run: docker compose exec -T server sh < ../smoke.sh

      - name: Probe a job's box from inside it
        working-directory: deploy/compose
        run: docker compose exec -T server sh < ../smoke-isolation.sh

      - name: Sign in through the identity provider, as an admin
        run: deploy/ssocheck/sign-in.sh http://127.0.0.1:8040 admin

      - name: Sign in as somebody no group maps to, and be refused
        working-directory: deploy/compose
        run: |
          { echo "HAAS_ADMIN_GROUPS=nobody"; echo "HAAS_RUNNER_GROUPS=nobody"; } >> .env
          docker compose up -d --no-build
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8040/healthz > /dev/null 2>&1 && break
            sleep 2
          done
          ../ssocheck/sign-in.sh http://127.0.0.1:8040 refused

      - name: The server's log, when something failed
        if: failure()
        working-directory: deploy/compose
        run: |
          docker compose logs --no-color | tail -80
          docker logs stub 2>&1 | tail -20
          docker logs dex 2>&1 | tail -20

      - name: Take it down
        if: always()
        working-directory: deploy/compose
        run: |
          docker rm -f stub dex || true
          docker compose down -v

  chart:
    needs: compose
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TAG: ${{ inputs.tag || 'v0.1.0-rc.1' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The digests the release names
        id: digests
        run: |
          notes="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          echo "server=$(sed -n 's/^HAAS_SERVER_IMAGE=//p' <<<"$notes")" >> "$GITHUB_OUTPUT"
          echo "runner=$(sed -n 's/^HAAS_RUNNER_IMAGE=//p' <<<"$notes")" >> "$GITHUB_OUTPUT"

      - name: A cluster to install into
        run: |
          kind create cluster --wait 120s
          kubectl create namespace haas
          kubectl label namespace haas pod-security.kubernetes.io/enforce=privileged --overwrite

      # The images are private. The kubelet pulls the server and the daemon in
      # the pod pulls the runner, and both read this one Secret.
      - name: Let the cluster pull the private images
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          kubectl -n haas create secret docker-registry ghcr \
            --docker-server=ghcr.io --docker-username="$GITHUB_ACTOR" --docker-password="$REGISTRY_TOKEN"

      # A model that answers the same way every time, in the cluster, so the proxy's
      # count can be compared with known numbers.
      - name: A stub model for the proxy to count
        run: |
          kubectl -n haas create configmap stub --from-file=stub.py=deploy/stubmodel/stub.py
          kubectl -n haas create secret generic credentials \
            --from-literal=stub.json='{"name":"stub","address":"http://stub:9000","key":"not-a-key"}'
          kubectl -n haas apply -f - <<'YAML'
          apiVersion: apps/v1
          kind: Deployment
          metadata: { name: stub }
          spec:
            replicas: 1
            selector: { matchLabels: { app: stub } }
            template:
              metadata: { labels: { app: stub } }
              spec:
                containers:
                  - name: stub
                    image: python:3.13-alpine
                    command: [python, -u, /stub/stub.py]
                    volumeMounts: [{ name: stub, mountPath: /stub }]
                volumes: [{ name: stub, configMap: { name: stub } }]
          ---
          apiVersion: v1
          kind: Service
          metadata: { name: stub }
          spec:
            selector: { app: stub }
            ports: [{ port: 9000 }]
          YAML
          kubectl -n haas rollout status deploy/stub --timeout=120s

      - name: An identity provider for the chart to sign in through
        run: |
          kubectl -n haas create configmap dex --from-file=config.docker.yaml=deploy/ssocheck/dex.yaml
          kubectl -n haas apply -f - <<'YAML'
          apiVersion: apps/v1
          kind: Deployment
          metadata: { name: dex }
          spec:
            replicas: 1
            selector: { matchLabels: { app: dex } }
            template:
              metadata: { labels: { app: dex } }
              spec:
                containers:
                  - name: dex
                    image: ghcr.io/dexidp/dex:v2.42.0@sha256:1b4a6eee8550240b0faedad04d984ca939513650e1d9bd423502c67355e3822f
                    volumeMounts: [{ name: config, mountPath: /etc/dex }]
                volumes: [{ name: config, configMap: { name: dex } }]
          ---
          apiVersion: v1
          kind: Service
          metadata: { name: dex }
          spec:
            selector: { app: dex }
            ports: [{ port: 5556 }]
          YAML
          kubectl -n haas rollout status deploy/dex --timeout=120s

      - name: Install the chart from the digests
        env:
          SERVER: ${{ steps.digests.outputs.server }}
          RUNNER: ${{ steps.digests.outputs.runner }}
        run: |
          helm install haas deploy/helm/haas --namespace haas \
            --set image.server.repository="${SERVER%@*}" --set image.server.digest="${SERVER#*@}" \
            --set image.runner.repository="${RUNNER%@*}" --set image.runner.digest="${RUNNER#*@}" \
            --set 'imagePullSecrets[0].name=ghcr' --set runnerPullSecret=ghcr \
            --set auth.password=install-check \
            --set auth.oidc.issuer=http://dex:5556/dex --set auth.oidc.clientId=haas --set auth.oidc.clientSecret=haas-secret \
            --set auth.oidc.redirect=http://127.0.0.1:8040/auth/callback --set auth.oidc.scopes=groups --set auth.oidc.adminGroups=authors \
            --set credentials.existingSecret=credentials --set model.models=stub/stub-model \
            --set spend.prices.stub-model.inputPerMillion=1000 --set spend.prices.stub-model.outputPerMillion=10000 \
            --wait --timeout 12m

      - name: What is running is what the release named
        env:
          SERVER: ${{ steps.digests.outputs.server }}
        run: |
          running="$(kubectl -n haas get deploy haas -o jsonpath='{.spec.template.spec.containers[?(@.name=="server")].image}')"
          test "$running" = "$SERVER" || { echo "the server runs $running, and the release named $SERVER"; exit 1; }
          echo "the server runs $running"

      - name: Sign in and reach the pages
        run: |
          kubectl -n haas port-forward svc/haas 8040:80 > /dev/null 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8040/healthz > /dev/null 2>&1 && break; sleep 1; done
          code="$(curl -s -o /dev/null -w '%{http_code}' -c jar --data-urlencode password=install-check http://127.0.0.1:8040/login)"
          test "$code" = 303 || { echo "signing in answered $code"; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' -b jar http://127.0.0.1:8040/)"
          test "$code" = 200 || { echo "the home page answered $code"; exit 1; }
          echo "signed in, and the home page answered $code"

      - name: Run a job that asks a model, and check what the proxy counted
        run: kubectl -n haas exec -i deploy/haas -c server -- sh < deploy/smoke-model.sh

      - name: Run a job and verify its record
        run: kubectl -n haas exec -i deploy/haas -c server -- sh < deploy/smoke.sh

      - name: Probe a job's box from inside it
        run: kubectl -n haas exec -i deploy/haas -c server -- sh < deploy/smoke-isolation.sh

      - name: Sign in through the identity provider, as an admin
        run: |
          kubectl -n haas port-forward svc/dex 5556:5556 > /dev/null 2>&1 &
          sleep 3
          deploy/ssocheck/sign-in.sh http://127.0.0.1:8040 admin

      - name: What the pod says, when something failed
        if: failure()
        run: |
          kubectl -n haas get pods -o wide
          kubectl -n haas describe pods | tail -60
          kubectl -n haas logs deploy/haas --all-containers --tail=60 || true
