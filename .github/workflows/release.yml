# A version tag publishes the server and runner images, so an install pulls
# them by digest instead of building from source. Each image is pushed to GHCR
# with an SBOM and build provenance attached, signed with this workflow's own
# identity (no key to keep), and named by digest in the release.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The runner carries the harnesses and MCP packages deploy/ansible/group_vars
# pins, so greencloud and a published image run the same versions.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: The release says what changes for an operator
        run: |
          grep -q "^## ${GITHUB_REF_NAME}\$" docs/RELEASES.md || { echo "docs/RELEASES.md has no section named ${GITHUB_REF_NAME}: rename its Next release section"; exit 1; }
      - name: Formatted
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...

  images:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      # The signature is made with this workflow's OIDC identity.
      id-token: write
    strategy:
      matrix:
        include:
          - image: server
            file: deploy/server/Dockerfile
          - image: runner
            file: Dockerfile
    env:
      REPOSITORY: ghcr.io/${{ github.repository_owner }}/haas-${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: What the runner carries
        id: pins
        if: matrix.image == 'runner'
        run: |
          vars=deploy/ansible/group_vars/all.yml
          echo "harnesses=$(yq -r '.runner_harnesses | join(" ")' "$vars")" >> "$GITHUB_OUTPUT"
          echo "mcp=$(yq -r '.runner_mcp_packages | join(" ")' "$vars")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The root Dockerfile names its bases by tag; these contexts replace them
      # with the same images by digest, as deploy/compose does.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.REPOSITORY }}:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          build-args: |
            HARNESSES=${{ steps.pins.outputs.harnesses }}
            MCP_SERVERS=${{ steps.pins.outputs.mcp }}
          build-contexts: |
            golang:1.26=docker-image://docker.io/library/golang:1.26@sha256:6c2a5538f964f1c82f97ad14988bf05de100d922d159d0e398b54c7b0ca0c6c9
            node:24-slim=docker-image://docker.io/library/node:24-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign
        run: cosign sign --yes "$REPOSITORY@${{ steps.build.outputs.digest }}"

      - name: Name the digest
        run: |
          mkdir -p digests
          echo "$REPOSITORY@${{ steps.build.outputs.digest }}" > "digests/${{ matrix.image }}"
          echo "\`$REPOSITORY@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.image }}
          path: digests/${{ matrix.image }}

  helper:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        target: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build and pack the helper for one system
        run: |
          target="${{ matrix.target }}"
          deploy/helper/build.sh "$GITHUB_REF_NAME" "${target%/*}" "${target#*/}" dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helper-${{ strategy.job-index }}
          path: dist/*

  release:
    needs: [images, helper]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: helper-*
          merge-multiple: true
          path: dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the helper's checksums
        run: |
          cp deploy/helper/install.sh deploy/helper/install.ps1 dist/
          cd dist
          sha256sum haas-helper_* install.sh install.ps1 > SHA256SUMS
          cosign sign-blob --yes SHA256SUMS --output-signature SHA256SUMS.sig --output-certificate SHA256SUMS.pem
          ls -la
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          server="$(cat digests/server)"
          runner="$(cat digests/runner)"
          identity="https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/$TAG"
          cat > notes.md <<EOF
          Images, by digest:

          \`\`\`
          HAAS_SERVER_IMAGE=$server
          HAAS_RUNNER_IMAGE=$runner
          \`\`\`

          Check a signature before pulling:

          \`\`\`bash
          cosign verify $server \\
            --certificate-identity $identity \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`

          The helper for a person's computer, for macOS, Linux and Windows, on Intel and Arm, with SHA256SUMS signed by this
          workflow. The releases are private, so install with the GitHub command line signed in:

          \`\`\`bash
          gh release download $TAG -R ${{ github.repository }} -p install.sh -O - | sh -s -- $TAG
          \`\`\`

          On Windows, \`install.ps1\` is attached beside it.
          EOF
          {
            printf '\n## What changed\n\n'
            gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="$TAG" --jq .body
          } >> notes.md
          {
            printf '\n## What changes for an operator\n\n'
            awk -v tag="## $TAG" '$0 == tag {on=1; next} /^## / {on=0} on' docs/RELEASES.md
          } >> notes.md
          # A tag with a hyphen, v0.1.0-rc.1, is a release candidate.
          case "$TAG" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$TAG" --repo "${{ github.repository }}" --title "$TAG" --notes-file notes.md $pre dist/*
