# A version tag publishes the server and runner images, so an install pulls
# them by digest instead of building from source. Each image is pushed to GHCR
# with an SBOM and build provenance attached, signed with this workflow's own
# identity (no key to keep), and named by digest in the release.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The runner carries the harnesses and MCP packages deploy/ansible/group_vars
# pins, so greencloud and a published image run the same versions.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: The release says what changes for an operator
        run: |
          grep -q "^## ${GITHUB_REF_NAME}\$" docs/RELEASES.md || { echo "docs/RELEASES.md has no section named ${GITHUB_REF_NAME}: rename its Next release section"; exit 1; }
      - name: Formatted
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...

  images:
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      # The signature is made with this workflow's OIDC identity.
      id-token: write
    strategy:
      matrix:
        # Each processor builds on its own kind of machine: the runner carries six harnesses, and building it for arm64 under
        # emulation takes far longer than the job may. The arm64 image has its own tag, <release>-arm64.
        include:
          - {image: server, file: deploy/server/Dockerfile, arch: amd64, runner: ubuntu-latest, suffix: ""}
          - {image: runner, file: Dockerfile, arch: amd64, runner: ubuntu-latest, suffix: ""}
          - {image: server, file: deploy/server/Dockerfile, arch: arm64, runner: ubuntu-24.04-arm, suffix: "-arm64"}
          - {image: runner, file: Dockerfile, arch: arm64, runner: ubuntu-24.04-arm, suffix: "-arm64"}
    env:
      REPOSITORY: ghcr.io/${{ github.repository_owner }}/haas-${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: What the runner carries
        id: pins
        if: matrix.image == 'runner'
        run: |
          vars=deploy/ansible/group_vars/all.yml
          echo "harnesses=$(yq -r '.runner_harnesses | join(" ")' "$vars")" >> "$GITHUB_OUTPUT"
          echo "mcp=$(yq -r '.runner_mcp_packages | join(" ")' "$vars")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The root Dockerfile names its bases by tag; these contexts replace them
      # with the same images by digest, as deploy/compose does.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.REPOSITORY }}:${{ github.ref_name }}${{ matrix.suffix }}
          provenance: mode=max
          sbom: true
          build-args: |
            HARNESSES=${{ steps.pins.outputs.harnesses }}
            MCP_SERVERS=${{ steps.pins.outputs.mcp }}
          build-contexts: |
            golang:1.26=docker-image://docker.io/library/golang:1.26@sha256:6c2a5538f964f1c82f97ad14988bf05de100d922d159d0e398b54c7b0ca0c6c9
            node:24-slim=docker-image://docker.io/library/node:24-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign
        run: cosign sign --yes "$REPOSITORY@${{ steps.build.outputs.digest }}"

      - name: Name the digest
        run: |
          mkdir -p digests
          echo "$REPOSITORY@${{ steps.build.outputs.digest }}" > "digests/${{ matrix.image }}${{ matrix.suffix }}"
          echo "\`$REPOSITORY@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.image }}${{ matrix.suffix }}
          path: digests/${{ matrix.image }}${{ matrix.suffix }}

  helper:
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      matrix:
        # macOS draws the menu bar icon through the system's libraries, so its helpers are built on macOS.
        include:
          - {target: linux/amd64, runner: ubuntu-latest}
          - {target: linux/arm64, runner: ubuntu-latest}
          - {target: darwin/amd64, runner: macos-latest}
          - {target: darwin/arm64, runner: macos-latest}
          - {target: windows/amd64, runner: ubuntu-latest}
          - {target: windows/arm64, runner: ubuntu-latest}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build and pack the helper for one system
        run: |
          target="${{ matrix.target }}"
          deploy/helper/build.sh "$GITHUB_REF_NAME" "${target%/*}" "${target#*/}" dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helper-${{ strategy.job-index }}
          path: dist/*

  # The haas program for each system, which needs no C compiler, so one machine builds all six.
  server:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build and pack haas for each system
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            deploy/server/build.sh "$GITHUB_REF_NAME" "${target%/*}" "${target#*/}" dist
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server
          path: dist/*

  # The desktop app, for each system it is built for. macOS is built on the machine that deploys, where it costs no hosted minutes,
  # and both Macs are built there, the Intel one by cross-compiling. Each build is signed with the update key, which the app holds
  # the public half of, and leaves its installer, its update and a record of which system it is.
  desktop:
    needs: test
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: aarch64-apple-darwin, runner: '["self-hosted", "haas"]'}
          - {target: x86_64-apple-darwin, runner: '["self-hosted", "haas"]'}
          - {target: x86_64-pc-windows-msvc, runner: '"windows-latest"'}
          - {target: x86_64-unknown-linux-gnu, runner: '"ubuntu-latest"'}
    defaults:
      run:
        shell: bash
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Rust and the platform's C compiler, which the deploying machine has already
        if: runner.os == 'macOS'
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "CC=/usr/bin/clang" >> "$GITHUB_ENV"
      - name: The web view's libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - name: The target and the build tool
        run: |
          rustup target add "${{ matrix.target }}"
          cargo install tauri-cli --version 2.12.1 --locked
      - name: Build, bundle and sign the app
        run: deploy/desktop/build.sh "$GITHUB_REF_NAME" "${{ matrix.target }}" dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.target }}
          path: dist/*

  # The runner image flattened to a root file system for the virtual machine a job runs in on a person's computer (haas local wall
  # install). The gateway takes a .tar.gz, and the processor has to be the computer's: an Apple Silicon Mac runs arm64.
  rootfs:
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-latest}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the runner and export its file system
        run: |
          vars=deploy/ansible/group_vars/all.yml
          docker buildx build --file Dockerfile --platform "linux/${{ matrix.arch }}" \
            --build-arg "HARNESSES=$(yq -r '.runner_harnesses | join(" ")' "$vars")" \
            --build-arg "MCP_SERVERS=$(yq -r '.runner_mcp_packages | join(" ")' "$vars")" \
            --build-context golang:1.26=docker-image://docker.io/library/golang:1.26@sha256:6c2a5538f964f1c82f97ad14988bf05de100d922d159d0e398b54c7b0ca0c6c9 \
            --build-context node:24-slim=docker-image://docker.io/library/node:24-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6 \
            --output type=tar,dest=rootfs.tar .
      - name: Pack it with its checksum and size
        run: |
          name="haas-rootfs-${{ matrix.arch }}.tar.gz"
          mkdir -p dist
          gzip -9 < rootfs.tar > "dist/$name"
          printf '%s  %s  %s\n' "$(sha256sum "dist/$name" | cut -d' ' -f1)" "$(stat -c %s "dist/$name")" "$name" > "dist/$name.sha256"
          cat "dist/$name.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootfs-${{ matrix.arch }}
          path: dist/*

  # mke2fs, debugfs and e2fsck built to stand alone on a Mac, which the virtual machine wall needs and a Mac lacks. Built on the machine
  # that deploys, where it costs no hosted minutes.
  e2fsprogs:
    needs: test
    runs-on: ["self-hosted", "haas"]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and pack the tools
        run: deploy/e2fsprogs/build.sh dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2fsprogs
          path: dist/*

  release:
    needs: [images, helper, server, desktop, rootfs, e2fsprogs]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: helper-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rootfs-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2fsprogs
          path: dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Join the desktop builds into the release's manifest
        run: deploy/desktop/manifest.sh "$GITHUB_REF_NAME" dist
      - name: Sign the checksums of haas, the helper and the app
        run: |
          cp deploy/install/install.sh deploy/install/install.ps1 dist/
          cd dist
          sha256sum haas_* haas-helper_* haas-rootfs-* haas-e2fsprogs-* latentic-agent-cloud_* desktop-manifest.json install.sh install.ps1 > SHA256SUMS
          cosign sign-blob --yes SHA256SUMS --bundle SHA256SUMS.sigstore.json
          ls -la
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          server="$(cat digests/server)"
          runner="$(cat digests/runner)"
          server_arm="$(cat digests/server-arm64)"
          runner_arm="$(cat digests/runner-arm64)"
          identity="https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/$TAG"
          cat > notes.md <<EOF
          Images, by digest:

          \`\`\`
          HAAS_SERVER_IMAGE=$server
          HAAS_RUNNER_IMAGE=$runner
          \`\`\`

          On an Arm computer (Apple Silicon Docker, Graviton), use the images with the -arm64 tag:

          \`\`\`
          HAAS_SERVER_IMAGE=$server_arm
          HAAS_RUNNER_IMAGE=$runner_arm
          \`\`\`

          Check a signature before pulling:

          \`\`\`bash
          cosign verify $server \\
            --certificate-identity $identity \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`

          \`haas\` and the helper for a person's computer, for macOS, Linux and Windows, on Intel and Arm, with SHA256SUMS signed by
          this workflow. While the releases are private, install with the GitHub command line signed in:

          \`\`\`bash
          gh release download $TAG -R ${{ github.repository }} -p install.sh -O - | sh -s -- $TAG
          \`\`\`

          On Windows, \`install.ps1\` is attached beside it.

          The desktop app, \`latentic-agent-cloud_*\`: a disk image for macOS (Apple silicon and Intel), an installer for Windows
          and an AppImage and a package for Linux. A server hands the app out to update itself with \`deploy/desktop/publish.sh\`
          (docs/DESKTOP.md, The app).
          EOF
          {
            printf '\n## What changed\n\n'
            gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="$TAG" --jq .body
          } >> notes.md
          {
            printf '\n## What changes for an operator\n\n'
            awk -v tag="## $TAG" '$0 == tag {on=1; next} /^## / {on=0} on' docs/RELEASES.md
          } >> notes.md
          # A tag with a hyphen, v0.1.0-rc.1, is a release candidate.
          case "$TAG" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$TAG" --repo "${{ github.repository }}" --title "$TAG" --notes-file notes.md $pre dist/*
