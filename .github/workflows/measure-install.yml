# Temporary: times the Compose install built from source on a clean GitHub-hosted runner.
name: measure-install
on:
  push:
    branches: ["measure-the-install"]
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The machine
        run: |
          uname -srm; nproc; free -g | head -2; docker --version; docker compose version
          lscpu | grep "Model name"
      - name: Build and start from source, timed
        working-directory: deploy/compose
        run: |
          sed "s|^HAAS_PASSWORD=.*|HAAS_PASSWORD=measure|; s|^HAAS_DATA=.*|HAAS_DATA=$RUNNER_TEMP/haas|" env.example > .env
          grep -q '^HAAS_DATA=' .env || echo "HAAS_DATA=$RUNNER_TEMP/haas" >> .env
          t0=$(date +%s.%N)
          docker compose build 2>&1 | tail -3
          t1=$(date +%s.%N)
          docker compose up -d
          until curl -fsS http://127.0.0.1:8040/healthz >/dev/null 2>&1; do sleep 0.5; done
          t2=$(date +%s.%N)
          until [ "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q server)")" = healthy ]; do sleep 0.5; done
          t3=$(date +%s.%N)
          echo "MEASURED build both images: $(echo "$t1 - $t0" | bc) s"
          echo "MEASURED up until /healthz answers: $(echo "$t2 - $t1" | bc) s"
          echo "MEASURED up until compose reads healthy: $(echo "$t3 - $t1" | bc) s"
          docker compose ps -a
      - name: Take it down
        if: always()
        working-directory: deploy/compose
        run: docker compose down -v
