# Every push to main is formatted, vetted and tested with the race detector, on
# a machine of ours. Pull requests run the builds; this is where the tests run.
name: test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: [self-hosted, gusto]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The runner is a machine of ours whose Go caches stay between runs. Restoring and saving GitHub's copy of them has
          # hung for an hour on a stalled download or upload.
          cache: false
      # The macOS helper and its tests link the system's own libraries through cgo. A C compiler that is not Apple's, such as
      # Homebrew's, cannot read the SDK's current text stubs, so the link fails.
      - name: Use the platform's C compiler
        if: runner.os == 'macOS'
        run: echo "CC=/usr/bin/clang" >> "$GITHUB_ENV"
      - name: Formatted
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
